<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprobar corrección — Miski Samay</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f4f1eb;
    color: #2c2620;
    padding: 20px;
    min-height: 100vh;
  }
  .card {
    max-width: 480px;
    margin: 0 auto;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    overflow: hidden;
  }
  .header {
    background: #5c4a3a;
    color: #fff;
    padding: 20px;
    text-align: center;
  }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header p { font-size: 13px; opacity: 0.85; margin-top: 4px; }
  .body { padding: 20px; }
  .loading, .error { text-align: center; padding: 40px 20px; color: #888; }
  .error { color: #b03a2e; }
  .section { margin-bottom: 18px; }
  .section-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    color: #999; margin-bottom: 6px; font-weight: 600;
  }
  .row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
  .row .k { color: #666; }
  .row .v { font-weight: 600; }
  .box {
    background: #f9f7f3; border-radius: 10px; padding: 14px; margin-bottom: 10px;
  }
  .box.actual { border-left: 3px solid #999; }
  .box.propuesto { border-left: 3px solid #d4a017; }
  .motivo {
    background: #fff8e6; border-radius: 10px; padding: 12px 14px;
    font-size: 14px; font-style: italic; color: #5c4a3a;
  }
  .quien-eres { margin: 20px 0; }
  select {
    width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd;
    font-size: 15px; background: #fff;
  }
  .botones { display: flex; gap: 10px; margin-top: 20px; }
  button {
    flex: 1; padding: 14px; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn-aprobar { background: #2e7d32; color: #fff; }
  .btn-rechazar { background: #c62828; color: #fff; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .resultado {
    text-align: center; padding: 30px 20px; font-size: 16px; font-weight: 600;
  }
  .resultado.ok { color: #2e7d32; }
  .resultado.no { color: #c62828; }
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 600; margin-top: 6px;
  }
  .badge.pendiente { background: #fff3cd; color: #856404; }
  .badge.aprobada { background: #d4edda; color: #155724; }
  .badge.rechazada { background: #f8d7da; color: #721c24; }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>🔐 Aprobación de corrección</h1>
    <p>Miski Samay — SETUMIS S.R.L.</p>
  </div>
  <div class="body" id="body">
    <div class="loading">Cargando solicitud...</div>
  </div>
</div>

<script>
const API = "https://miski-samay-backend-production.up.railway.app";
const params = new URLSearchParams(window.location.search);
const token = params.get("token");
const bodyEl = document.getElementById("body");

let solicitud = null;
let staffAprobadores = [];

function fmtMonto(n) {
  return Number(n || 0).toFixed(2);
}

function renderError(msg) {
  bodyEl.innerHTML = `<div class="error">⚠️ ${msg}</div>`;
}

async function cargar() {
  if (!token) {
    renderError("Falta el token en el link. Verifica que abriste el link completo desde WhatsApp.");
    return;
  }
  try {
    const [resSol, resStaff] = await Promise.all([
      fetch(`${API}/api/solicitudes-correccion/${token}`),
      fetch(`${API}/api/staff`)
    ]);
    if (!resSol.ok) {
      const err = await resSol.json().catch(() => ({}));
      renderError(err.error || "No se pudo cargar la solicitud.");
      return;
    }
    solicitud = await resSol.json();
    const staffList = await resStaff.json();
    staffAprobadores = staffList.filter(s => s.nombre === "Dante" || s.nombre === "Yanet");
    render();
  } catch (e) {
    console.error(e);
    renderError("Error de conexión. Intenta de nuevo.");
  }
}

function render() {
  const nuevoPago = solicitud.nuevo_pago;
  const conceptoLabel = nuevoPago.concepto === "hospedaje" ? "Hospedaje" : "Consumo";
  const montoActual = nuevoPago.concepto === "hospedaje" ? solicitud.monto_alojamiento : solicitud.monto_consumos;

  let html = `
    <div class="section">
      <div class="section-label">Domo / Reserva</div>
      <div class="row"><span class="k">Domo</span><span class="v">${solicitud.domo_codigo || "—"}</span></div>
      <div class="row"><span class="k">Solicitado por</span><span class="v">${solicitud.solicitado_por_nombre}</span></div>
    </div>

    <div class="section">
      <div class="section-label">Motivo</div>
      <div class="motivo">${solicitud.motivo}</div>
    </div>

    <div class="section">
      <div class="section-label">Pago actual</div>
      <div class="box actual">
        <div class="row"><span class="k">Concepto</span><span class="v">${conceptoLabel}</span></div>
        <div class="row"><span class="k">Monto</span><span class="v">${fmtMonto(montoActual)}</span></div>
        <div class="row"><span class="k">Método</span><span class="v">${solicitud.metodo_pago}</span></div>
        <div class="row"><span class="k">Moneda</span><span class="v">${solicitud.moneda}</span></div>
      </div>
    </div>

    <div class="section">
      <div class="section-label">Corrección propuesta</div>
      <div class="box propuesto">
        <div class="row"><span class="k">Monto</span><span class="v">${fmtMonto(nuevoPago.monto)}</span></div>
        <div class="row"><span class="k">Método</span><span class="v">${nuevoPago.metodoPago}</span></div>
        <div class="row"><span class="k">Moneda</span><span class="v">${nuevoPago.moneda}</span></div>
        ${nuevoPago.tipoCambio ? `<div class="row"><span class="k">Tipo de cambio</span><span class="v">${nuevoPago.tipoCambio}</span></div>` : ""}
        ${nuevoPago.detalleMixto ? `<div class="row"><span class="k">Desglose mixto</span><span class="v">${nuevoPago.detalleMixto.map(p => `${p.metodo}: ${fmtMonto(p.monto)}`).join(", ")}</span></div>` : ""}
      </div>
    </div>
  `;

  if (solicitud.estado !== "pendiente") {
    const label = solicitud.estado === "aprobada" ? "✅ Ya fue aprobada" : "❌ Ya fue rechazada";
    html += `<div class="resultado ${solicitud.estado === "aprobada" ? "ok" : "no"}">${label}</div>`;
    bodyEl.innerHTML = html;
    return;
  }

  html += `
    <div class="quien-eres">
      <div class="section-label">¿Quién eres?</div>
      <select id="quienEres">
        <option value="">Selecciona...</option>
        ${staffAprobadores.map(s => `<option value="${s.id}">${s.nombre}</option>`).join("")}
      </select>
    </div>
    <div class="botones">
      <button class="btn-rechazar" id="btnRechazar">❌ Rechazar</button>
      <button class="btn-aprobar" id="btnAprobar">✅ Aprobar</button>
    </div>
  `;

  bodyEl.innerHTML = html;

  document.getElementById("btnAprobar").addEventListener("click", () => resolver("aprobar"));
  document.getElementById("btnRechazar").addEventListener("click", () => resolver("rechazar"));
}

async function resolver(decision) {
  const staffId = document.getElementById("quienEres").value;
  if (!staffId) {
    alert("Selecciona quién eres antes de continuar.");
    return;
  }
  const btnAprobar = document.getElementById("btnAprobar");
  const btnRechazar = document.getElementById("btnRechazar");
  btnAprobar.disabled = true;
  btnRechazar.disabled = true;

  try {
    const res = await fetch(`${API}/api/solicitudes-correccion/${token}/resolver`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ decision, staffId })
    });
    const data = await res.json();
    if (!res.ok) {
      alert(data.error || "No se pudo procesar la decisión.");
      btnAprobar.disabled = false;
      btnRechazar.disabled = false;
      return;
    }
    bodyEl.innerHTML = `
      <div class="resultado ${decision === "aprobar" ? "ok" : "no"}">
        ${decision === "aprobar" ? "✅ Corrección aprobada" : "❌ Corrección rechazada"}
      </div>
    `;
  } catch (e) {
    console.error(e);
    alert("Error de conexión. Intenta de nuevo.");
    btnAprobar.disabled = false;
    btnRechazar.disabled = false;
  }
}

cargar();
</script>

</body>
</html>
