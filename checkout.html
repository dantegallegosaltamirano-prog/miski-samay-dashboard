<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Miski Samay — Check-out</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  input[type=number]::-webkit-inner-spin-button { opacity: 1; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const T = {
  bg: "#0E0D0F", card: "#1C1A20", cardBorder: "#2A2730",
  gold: "#C9A24B", ivory: "#EFEAE1", ivoryMuted: "#9B968E",
  green: "#6B8F71", red: "#A83E32", amber: "#B8873B",
};

const API_BASE_URL = "https://miski-samay-backend-production.up.railway.app";

// Métodos disponibles para una línea completa (incluye "mixto")
const METODOS = [
  { valor: "efectivo", label: "Efectivo" },
  { valor: "pos", label: "Tarjeta / POS" },
  { valor: "transferencia", label: "Transferencia" },
  { valor: "yape", label: "Yape" },
  { valor: "mixto", label: "Mixto" },
];

// Métodos válidos dentro de un desglose "mixto" (no se puede anidar "mixto")
const METODOS_MIXTO = [
  { valor: "efectivo", label: "Efectivo" },
  { valor: "pos", label: "Tarjeta / POS" },
  { valor: "transferencia", label: "Transferencia" },
  { valor: "yape", label: "Yape" },
];

const idBloqueado = new URLSearchParams(window.location.search).get("id");

function fmt(n) {
  return Number(n || 0).toFixed(2);
}
function round2(n) {
  return Math.round((Number(n) || 0) * 100) / 100;
}
function nuevaParteMixto() {
  return { metodo: "efectivo", monto: "" };
}

const selectStyle = {
  width: "100%", background: T.bg, border: `1px solid ${T.cardBorder}`, borderRadius: 8,
  padding: "9px 12px", color: T.ivory, fontSize: 14,
};
const waBtn = {
  flex: 1, textAlign: "center", background: "#25D366", color: "#0E0D0F", padding: "12px 0",
  borderRadius: 10, textDecoration: "none", fontWeight: 700, fontSize: 13, display: "block",
};
function tabEstilo(activo) {
  return {
    flex: 1, padding: "10px 0", borderRadius: 10, cursor: "pointer", fontSize: 13, fontWeight: 700,
    border: activo ? `2px solid ${T.gold}` : `1px solid ${T.cardBorder}`,
    background: activo ? "rgba(201,162,75,0.15)" : T.card,
    color: activo ? T.gold : T.ivoryMuted,
  };
}

function BotonMoneda({ moneda, onChange }) {
  return (
    <div style={{ display: "flex", gap: 6 }}>
      {["USD", "PEN"].map((m) => (
        <button key={m} onClick={() => onChange(m)} style={{
          padding: "6px 12px", borderRadius: 8, cursor: "pointer", fontSize: 12, fontWeight: 700,
          border: moneda === m ? `2px solid ${T.gold}` : `1px solid ${T.cardBorder}`,
          background: moneda === m ? "rgba(201,162,75,0.15)" : T.bg,
          color: moneda === m ? T.gold : T.ivoryMuted,
        }}>
          {m === "USD" ? "US$" : "S/."}
        </button>
      ))}
    </div>
  );
}

function SelectorMetodo({ valor, onChange }) {
  return (
    <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
      {METODOS.map((m) => (
        <button key={m.valor} onClick={() => onChange(m.valor)} style={{
          padding: "6px 10px", borderRadius: 8, cursor: "pointer", fontSize: 11.5, fontWeight: 600,
          border: valor === m.valor ? `2px solid ${T.gold}` : `1px solid ${T.cardBorder}`,
          background: valor === m.valor ? "rgba(201,162,75,0.15)" : T.bg,
          color: valor === m.valor ? T.gold : T.ivoryMuted,
        }}>
          {m.label}
        </button>
      ))}
    </div>
  );
}

function DesgloseMixto({ partes, onChange, total, simbolo }) {
  const suma = partes.reduce((acc, p) => acc + (Number(p.monto) || 0), 0);
  const cuadra = Math.abs(suma - total) < 0.01;

  function actualizarParte(i, campo, valor) {
    const nuevas = partes.map((p, idx) => idx === i ? { ...p, [campo]: valor } : p);
    onChange(nuevas);
  }
  function agregarParte() {
    if (partes.length < 3) onChange([...partes, nuevaParteMixto()]);
  }
  function quitarParte(i) {
    if (partes.length > 2) onChange(partes.filter((_, idx) => idx !== i));
  }

  return (
    <div style={{ marginTop: 10, background: T.bg, border: `1px solid ${T.cardBorder}`, borderRadius: 10, padding: 12 }}>
      <div style={{ fontSize: 11.5, color: T.ivoryMuted, marginBottom: 8 }}>Desglose del pago mixto (2-3 partes):</div>
      {partes.map((p, i) => (
        <div key={i} style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8 }}>
          <select value={p.metodo} onChange={(e) => actualizarParte(i, "metodo", e.target.value)} style={{
            background: T.card, border: `1px solid ${T.cardBorder}`, borderRadius: 6, color: T.ivory,
            fontSize: 12.5, padding: "7px 8px", flex: "0 0 140px",
          }}>
            {METODOS_MIXTO.map((m) => <option key={m.valor} value={m.valor}>{m.label}</option>)}
          </select>
          <div style={{ display: "flex", alignItems: "center", flex: 1, gap: 4 }}>
            <span style={{ fontSize: 12, color: T.ivoryMuted }}>{simbolo}</span>
            <input type="number" min="0" step="0.01" value={p.monto}
              onChange={(e) => actualizarParte(i, "monto", e.target.value)}
              placeholder="0.00"
              style={{
                width: "100%", background: T.card, border: `1px solid ${T.cardBorder}`, borderRadius: 6,
                padding: "7px 8px", color: T.ivory, fontSize: 13,
              }} />
          </div>
          {partes.length > 2 && (
            <button onClick={() => quitarParte(i)} style={{
              background: "none", border: "none", color: T.red, cursor: "pointer", fontSize: 15, padding: "0 4px",
            }}>✕</button>
          )}
        </div>
      ))}
      {partes.length < 3 && (
        <button onClick={agregarParte} style={{
          background: "none", border: `1px dashed ${T.cardBorder}`, color: T.ivoryMuted, borderRadius: 6,
          padding: "5px 10px", fontSize: 11.5, cursor: "pointer", marginBottom: 4,
        }}>+ Agregar otra parte</button>
      )}
      <div style={{ fontSize: 12, fontWeight: 600, marginTop: 6, color: cuadra ? T.green : T.red }}>
        Suma: {simbolo} {fmt(suma)} / {simbolo} {fmt(total)} {cuadra ? "✓" : "— no coincide con el total"}
      </div>
    </div>
  );
}

function CorregirPago() {
  const [query, setQuery] = useState("");
  const [buscando, setBuscando] = useState(false);
  const [resultados, setResultados] = useState([]);
  const [busquedaHecha, setBusquedaHecha] = useState(false);

  const [reservaSel, setReservaSel] = useState(null);
  const [pagos, setPagos] = useState([]);
  const [cargandoPagos, setCargandoPagos] = useState(false);

  const [pagoSel, setPagoSel] = useState(null);

  const [staffList, setStaffList] = useState([]);
  const [correctorId, setCorrectorId] = useState("");
  const [motivo, setMotivo] = useState("");
  const [monto, setMonto] = useState("");
  const [moneda, setMoneda] = useState("USD");
  const [metodo, setMetodo] = useState("efectivo");
  const [tipoCambio, setTipoCambio] = useState("");
  const [mixto, setMixto] = useState([nuevaParteMixto(), nuevaParteMixto()]);

  const [enviando, setEnviando] = useState(false);
  const [errorForm, setErrorForm] = useState(null);
  const [correccionOk, setCorreccionOk] = useState(null);

  useEffect(() => {
    fetch(`${API_BASE_URL}/api/staff`).then(r => r.json()).then(setStaffList).catch(() => {});
  }, []);

  const staffGerencia = staffList.filter(s => s.rol === "gerencia");

  async function buscar() {
    if (!query.trim()) return;
    setBuscando(true);
    setBusquedaHecha(true);
    setReservaSel(null);
    setPagos([]);
    setPagoSel(null);
    try {
      const r = await fetch(`${API_BASE_URL}/api/reservas/buscar-cerradas?q=${encodeURIComponent(query.trim())}`);
      const data = await r.json();
      setResultados(Array.isArray(data) ? data : []);
    } catch (e) {
      setResultados([]);
    } finally {
      setBuscando(false);
    }
  }

  async function seleccionarReserva(r) {
    setReservaSel(r);
    setPagoSel(null);
    setCargandoPagos(true);
    try {
      const resp = await fetch(`${API_BASE_URL}/api/reservas/${r.reserva_id}/pagos-activos`);
      const data = await resp.json();
      setPagos(Array.isArray(data) ? data : []);
    } catch (e) {
      setPagos([]);
    } finally {
      setCargandoPagos(false);
    }
  }

  function seleccionarPago(p) {
    setPagoSel(p);
    setMonto(fmt(p.monto));
    setMoneda(p.moneda);
    setMetodo(p.metodo_pago);
    setTipoCambio(p.tipo_cambio_usado ? String(p.tipo_cambio_usado) : "");
    if (p.metodo_pago === "mixto" && p.detalle_pago_mixto) {
      const partes = typeof p.detalle_pago_mixto === "string" ? JSON.parse(p.detalle_pago_mixto) : p.detalle_pago_mixto;
      setMixto(Array.isArray(partes) && partes.length >= 2
        ? partes.map(x => ({ metodo: x.metodo, monto: String(x.monto) }))
        : [nuevaParteMixto(), nuevaParteMixto()]);
    } else {
      setMixto([nuevaParteMixto(), nuevaParteMixto()]);
    }
    setMotivo("");
    setErrorForm(null);
    setCorreccionOk(null);
  }

  const usaTipoCambio = pagoSel && (pagoSel.concepto === "hospedaje" ? moneda === "PEN" : moneda === "USD");
  const sumaMixto = mixto.reduce((a, p) => a + (Number(p.monto) || 0), 0);
  const mixtoOk = metodo !== "mixto" || Math.abs(sumaMixto - round2(Number(monto) || 0)) < 0.01;
  const tipoCambioOk = !usaTipoCambio || Number(tipoCambio) > 0;
  const puedeCorregir = pagoSel && correctorId && motivo.trim().length >= 5 && Number(monto) > 0 && mixtoOk && tipoCambioOk;

  async function corregirPago() {
    if (!puedeCorregir) {
      setErrorForm("Completa todos los campos: quién corrige, motivo, monto válido y desglose correcto.");
      return;
    }
    setEnviando(true);
    setErrorForm(null);
    const nuevoPago = {
      concepto: pagoSel.concepto,
      monto: round2(Number(monto)),
      moneda,
      metodoPago: metodo,
    };
    if (usaTipoCambio) nuevoPago.tipoCambio = Number(tipoCambio);
    if (metodo === "mixto") nuevoPago.detalleMixto = mixto.map(p => ({ metodo: p.metodo, monto: round2(Number(p.monto) || 0) }));

    try {
      const resp = await fetch(`${API_BASE_URL}/api/pagos/${pagoSel.id}/corregir`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ motivo: motivo.trim(), staffId: correctorId, nuevoPago }),
      });
      const data = await resp.json();
      if (!resp.ok || data.error) throw new Error(data.error || "No se pudo corregir el pago");
      setCorreccionOk({ montoTotal: data.montoTotal });
    } catch (e) {
      setErrorForm(e.message);
    } finally {
      setEnviando(false);
    }
  }

  if (correccionOk) {
    return (
      <div>
        <div style={{ background: "rgba(107,143,113,0.12)", border: `1px solid ${T.green}`, borderRadius: 10, padding: 16, marginBottom: 16 }}>
          <div style={{ fontWeight: 700, color: T.green, marginBottom: 6 }}>✓ Pago corregido</div>
          <div style={{ fontSize: 13, color: T.ivoryMuted }}>
            El pago original quedó anulado (se conserva en el historial) y se creó el pago corregido
            {correccionOk.montoTotal != null ? ` por ${moneda === "USD" ? "US$" : "S/."} ${fmt(correccionOk.montoTotal)}` : ""}.
          </div>
        </div>
        <button onClick={() => { setReservaSel(null); setPagoSel(null); setCorreccionOk(null); setQuery(""); setResultados([]); setBusquedaHecha(false); }}
          style={{ background: T.gold, color: "#1C1A20", border: "none", borderRadius: 10, padding: "12px 0", width: "100%", fontWeight: 700, fontSize: 14, cursor: "pointer" }}>
          Buscar otra reserva
        </button>
      </div>
    );
  }

  if (pagoSel) {
    return (
      <div>
        <button onClick={() => setPagoSel(null)} style={{ background: "none", border: "none", color: T.ivoryMuted, fontSize: 12, cursor: "pointer", marginBottom: 12 }}>← Elegir otro pago</button>

        <div style={{ background: T.card, border: `1px solid ${T.cardBorder}`, borderRadius: 10, padding: 14, marginBottom: 16 }}>
          <div style={{ fontSize: 11, color: T.ivoryMuted, textTransform: "uppercase", marginBottom: 4 }}>Pago original</div>
          <div style={{ fontSize: 14, fontWeight: 700, textTransform: "capitalize" }}>
            {pagoSel.concepto} — {pagoSel.moneda === "USD" ? "US$" : "S/."} {fmt(pagoSel.monto)} ({METODOS.find(m => m.valor === pagoSel.metodo_pago)?.label})
          </div>
        </div>

        <div style={{ fontSize: 12, color: T.ivoryMuted, marginBottom: 6 }}>¿Quién corrige este pago? (solo gerencia)</div>
        <select value={correctorId} onChange={(e) => setCorrectorId(e.target.value)} style={selectStyle}>
          <option value="">Selecciona...</option>
          {staffGerencia.map(s => <option key={s.id} value={s.id}>{s.nombre}</option>)}
        </select>

        <div style={{ fontSize: 12, color: T.ivoryMuted, margin: "14px 0 6px" }}>Motivo de la corrección</div>
        <textarea value={motivo} onChange={(e) => setMotivo(e.target.value)} rows={2}
          placeholder="Ej: se cobró en efectivo pero fue transferencia"
          style={{ ...selectStyle, resize: "vertical", fontFamily: "inherit" }} />

        <div style={{ fontSize: 12, color: T.ivoryMuted, margin: "14px 0 6px" }}>Nuevo monto</div>
        <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 12 }}>
          <span style={{ fontSize: 14, color: T.ivoryMuted }}>{moneda === "USD" ? "US$" : "S/."}</span>
          <input type="number" min="0" step="0.01" value={monto} onChange={(e) => setMonto(e.target.value)}
            style={{ flex: 1, background: T.bg, border: `1px solid ${T.cardBorder}`, borderRadius: 8, padding: "9px 12px", color: T.ivory, fontSize: 14 }} />
        </div>

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <div style={{ fontSize: 12, color: T.ivoryMuted }}>Nueva moneda:</div>
          <BotonMoneda moneda={moneda} onChange={setMoneda} />
        </div>

        {usaTipoCambio && (
          <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 12 }}>
            <span style={{ fontSize: 11.5, color: T.amber, flex: 1 }}>
              Tipo de cambio ({pagoSel.concepto === "hospedaje" ? "venta" : "compra"}) — S/ por US$1:
            </span>
            <input type="number" min="0" step="0.001" value={tipoCambio} onChange={(e) => setTipoCambio(e.target.value)}
              style={{ width: 90, background: T.bg, border: `1px solid ${tipoCambioOk ? T.cardBorder : T.red}`, borderRadius: 6, padding: "6px 8px", color: T.ivory, fontSize: 13 }} />
          </div>
        )}

        <div style={{ fontSize: 12, color: T.ivoryMuted, marginBottom: 6 }}>Nuevo método de pago:</div>
        <SelectorMetodo valor={metodo} onChange={setMetodo} />
        {metodo === "mixto" && (
          <DesgloseMixto partes={mixto} onChange={setMixto} total={round2(Number(monto) || 0)} simbolo={moneda === "USD" ? "US$" : "S/."} />
        )}

        {errorForm && (
          <div style={{ background: "rgba(184,63,50,0.12)", border: "1px solid #A83E32", color: "#D98A7D", borderRadius: 10, padding: "10px 14px", fontSize: 13, margin: "14px 0" }}>
            {errorForm}
          </div>
        )}

        <button onClick={corregirPago} disabled={enviando} style={{
          width: "100%", background: enviando ? T.cardBorder : T.gold, color: enviando ? T.ivoryMuted : "#1C1A20",
          border: "none", borderRadius: 10, padding: "14px 0", fontSize: 14, fontWeight: 700,
          cursor: enviando ? "not-allowed" : "pointer", marginTop: 16,
        }}>
          {enviando ? "Corrigiendo..." : "Corregir pago"}
        </button>
      </div>
    );
  }

  if (reservaSel) {
    return (
      <div>
        <button onClick={() => setReservaSel(null)} style={{ background: "none", border: "none", color: T.ivoryMuted, fontSize: 12, cursor: "pointer", marginBottom: 12 }}>← Elegir otra reserva</button>
        <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 12 }}>{reservaSel.codigo} — {reservaSel.nombre_completo || "Por confirmar"}</div>
        {cargandoPagos ? (
          <div style={{ color: T.ivoryMuted, fontSize: 13 }}>Cargando pagos...</div>
        ) : pagos.length === 0 ? (
          <div style={{ color: T.ivoryMuted, fontSize: 13 }}>Esta reserva no tiene pagos activos para corregir.</div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {pagos.map(p => (
              <button key={p.id} onClick={() => seleccionarPago(p)} style={{
                textAlign: "left", padding: "12px 14px", borderRadius: 10, cursor: "pointer",
                border: `1px solid ${T.cardBorder}`, background: T.card, color: T.ivory,
              }}>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13.5 }}>
                  <span style={{ textTransform: "capitalize", fontWeight: 600 }}>{p.concepto}</span>
                  <span style={{ fontWeight: 700, color: T.gold }}>{p.moneda === "USD" ? "US$" : "S/."} {fmt(p.monto)}</span>
                </div>
                <div style={{ fontSize: 11.5, color: T.ivoryMuted, marginTop: 2 }}>
                  {METODOS.find(m => m.valor === p.metodo_pago)?.label} · {p.cerrado_en ? new Date(p.cerrado_en).toLocaleDateString("es-PE") : ""}
                </div>
              </button>
            ))}
          </div>
        )}
      </div>
    );
  }

  return (
    <div>
      <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 8 }}>Buscar por nombre de huésped o código</div>
      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        <input value={query} onChange={(e) => setQuery(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") buscar(); }}
          placeholder="Ej: Heather o D1"
          style={{ flex: 1, background: T.card, border: `1px solid ${T.cardBorder}`, borderRadius: 8, padding: "10px 12px", color: T.ivory, fontSize: 14 }} />
        <button onClick={buscar} style={{ background: T.gold, color: "#1C1A20", border: "none", borderRadius: 8, padding: "0 18px", fontWeight: 700, fontSize: 13, cursor: "pointer" }}>Buscar</button>
      </div>
      {buscando && <div style={{ color: T.ivoryMuted, fontSize: 13 }}>Buscando...</div>}
      {!buscando && busquedaHecha && resultados.length === 0 && (
        <div style={{ color: T.ivoryMuted, fontSize: 13 }}>No se encontraron reservas cerradas con ese criterio.</div>
      )}
      {!buscando && resultados.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {resultados.map(r => (
            <button key={r.reserva_id} onClick={() => seleccionarReserva(r)} style={{
              textAlign: "left", padding: "10px 14px", borderRadius: 10, cursor: "pointer",
              border: `1px solid ${T.cardBorder}`, background: T.card, color: T.ivory, fontSize: 13.5,
            }}>
              <strong>{r.codigo}</strong> — {r.nombre_completo || "Por confirmar"}
              <div style={{ fontSize: 11, color: T.ivoryMuted, marginTop: 2 }}>
                Salida: {r.fecha_salida ? new Date(r.fecha_salida).toLocaleDateString("es-PE") : "—"}
              </div>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function CheckoutPantalla() {
  const [modo, setModo] = useState("checkout"); // "checkout" | "corregir"
  const [huespedes, setHuespedes] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [reservaSel, setReservaSel] = useState(null);
  const [noEncontrado, setNoEncontrado] = useState(false);

  const [folio, setFolio] = useState(null);
  const [cargandoFolio, setCargandoFolio] = useState(false);
  const [errorFolio, setErrorFolio] = useState(null);

  // El adelanto siempre viene en USD desde el backend.
  const [adelantoMonto, setAdelantoMonto] = useState(0);
  const [aplicarAdelantoA, setAplicarAdelantoA] = useState("ninguno");

  const [monedaHospedaje, setMonedaHospedaje] = useState("USD");
  const [monedaConsumo, setMonedaConsumo] = useState("PEN");
  const [metodoHospedaje, setMetodoHospedaje] = useState("efectivo");
  const [metodoConsumo, setMetodoConsumo] = useState("efectivo");

  // Tipos de cambio editables por línea (solo se usan/mostrarán si la
  // moneda de cobro elegida no coincide con la moneda nativa del concepto).
  const [tipoCambioHospedaje, setTipoCambioHospedaje] = useState(0); // usado si monedaHospedaje === "PEN" (venta, "X")
  const [tipoCambioConsumo, setTipoCambioConsumo] = useState(0);     // usado si monedaConsumo === "USD" (compra, "Z")

  const [mixtoHospedaje, setMixtoHospedaje] = useState([nuevaParteMixto(), nuevaParteMixto()]);
  const [mixtoConsumo, setMixtoConsumo] = useState([nuevaParteMixto(), nuevaParteMixto()]);

  const [enviando, setEnviando] = useState(false);
  const [resultadoOk, setResultadoOk] = useState(null);
  const [errorEnvio, setErrorEnvio] = useState(null);

  useEffect(() => {
    fetch(`${API_BASE_URL}/api/domos/estado-hoy`)
      .then(r => r.json())
      .then(data => {
        const lista = Array.isArray(data) ? data : [];
        setHuespedes(lista);
        if (idBloqueado) {
          const encontrado = lista.find(h => h.reserva_id === idBloqueado);
          if (encontrado) setReservaSel(encontrado);
          else setNoEncontrado(true);
        }
        setCargando(false);
      })
      .catch(() => setCargando(false));
  }, []);

  useEffect(() => {
    if (!reservaSel) return;
    setCargandoFolio(true);
    setErrorFolio(null);
    setFolio(null);
    fetch(`${API_BASE_URL}/api/reservas/${reservaSel.reserva_id}/folio`)
      .then(r => r.json())
      .then(data => {
        if (data.error) { setErrorFolio(data.error); setCargandoFolio(false); return; }
        setFolio(data);
        const adelanto = Number(data.adelantoPagado) || 0;
        setAdelantoMonto(adelanto);
        setAplicarAdelantoA(adelanto > 0 ? "hospedaje" : "ninguno");
        const tc = Number(data.tipoCambio) || 0;
        setTipoCambioHospedaje(tc);
        setTipoCambioConsumo(tc);
        setCargandoFolio(false);
      })
      .catch(() => { setErrorFolio("No se pudo cargar el folio"); setCargandoFolio(false); });
  }, [reservaSel]);

  const tipoCambioRef = folio?.tipoCambio || null; // solo referencial, para desglose por categoría y adelanto
  const hospedajeUsd = folio ? Number(folio.montoAlojamientoUsd) || 0 : 0;
  const hospedajeSoles = tipoCambioRef ? hospedajeUsd * tipoCambioRef : 0;
  const consumoSoles = folio ? Number(folio.totalConsumosSoles) || 0 : 0;
  const consumoUsd = tipoCambioRef ? consumoSoles / tipoCambioRef : 0;

  // El adelanto siempre viene y se edita en USD.
  const adelantoUsd = adelantoMonto;
  const adelantoSoles = tipoCambioRef ? adelantoUsd * tipoCambioRef : 0;

  const saldoHospedajeUsd = aplicarAdelantoA === "hospedaje" ? Math.max(0, hospedajeUsd - adelantoUsd) : hospedajeUsd;
  const saldoConsumoSoles = aplicarAdelantoA === "consumo" ? Math.max(0, consumoSoles - adelantoSoles) : consumoSoles;

  // Monto final a cobrar por línea, según la moneda elegida.
  // Si coincide con la moneda nativa del concepto, no requiere tipo de cambio.
  const usaTipoCambioHospedaje = monedaHospedaje === "PEN"; // hospedaje nativo = USD
  const usaTipoCambioConsumo = monedaConsumo === "USD";     // consumo nativo = PEN

  const montoCobroHospedaje = usaTipoCambioHospedaje
    ? saldoHospedajeUsd * (Number(tipoCambioHospedaje) || 0)
    : saldoHospedajeUsd;
  const montoCobroConsumo = usaTipoCambioConsumo
    ? (Number(tipoCambioConsumo) > 0 ? saldoConsumoSoles / Number(tipoCambioConsumo) : 0)
    : saldoConsumoSoles;

  const hayHospedajeQueCobrar = montoCobroHospedaje > 0.009;
  const hayConsumoQueCobrar = montoCobroConsumo > 0.009;

  const sumaMixtoHospedaje = mixtoHospedaje.reduce((a, p) => a + (Number(p.monto) || 0), 0);
  const sumaMixtoConsumo = mixtoConsumo.reduce((a, p) => a + (Number(p.monto) || 0), 0);
  const mixtoHospedajeOk = metodoHospedaje !== "mixto" || !hayHospedajeQueCobrar || Math.abs(sumaMixtoHospedaje - round2(montoCobroHospedaje)) < 0.01;
  const mixtoConsumoOk = metodoConsumo !== "mixto" || !hayConsumoQueCobrar || Math.abs(sumaMixtoConsumo - round2(montoCobroConsumo)) < 0.01;

  const tipoCambioHospedajeOk = !usaTipoCambioHospedaje || !hayHospedajeQueCobrar || Number(tipoCambioHospedaje) > 0;
  const tipoCambioConsumoOk = !usaTipoCambioConsumo || !hayConsumoQueCobrar || Number(tipoCambioConsumo) > 0;

  const puedeEnviar = mixtoHospedajeOk && mixtoConsumoOk && tipoCambioHospedajeOk && tipoCambioConsumoOk;

  async function confirmarCheckout() {
    const pagos = [];
    if (hayHospedajeQueCobrar) {
      const linea = { concepto: "hospedaje", monto: round2(montoCobroHospedaje), moneda: monedaHospedaje, metodoPago: metodoHospedaje };
      if (usaTipoCambioHospedaje) linea.tipoCambio = Number(tipoCambioHospedaje);
      if (metodoHospedaje === "mixto") {
        linea.detalleMixto = mixtoHospedaje.map(p => ({ metodo: p.metodo, monto: round2(Number(p.monto) || 0) }));
      }
      pagos.push(linea);
    }
    if (hayConsumoQueCobrar) {
      const linea = { concepto: "consumo", monto: round2(montoCobroConsumo), moneda: monedaConsumo, metodoPago: metodoConsumo };
      if (usaTipoCambioConsumo) linea.tipoCambio = Number(tipoCambioConsumo);
      if (metodoConsumo === "mixto") {
        linea.detalleMixto = mixtoConsumo.map(p => ({ metodo: p.metodo, monto: round2(Number(p.monto) || 0) }));
      }
      pagos.push(linea);
    }
    if (pagos.length === 0) {
      alert("No hay saldo pendiente por cobrar (el adelanto cubre todo). Contacta soporte si esto no es correcto.");
      return;
    }
    if (!puedeEnviar) {
      alert("Revisa el desglose de pago mixto o el tipo de cambio antes de continuar — hay algo que no cuadra.");
      return;
    }

    setEnviando(true);
    setErrorEnvio(null);
    try {
      const resp = await fetch(`${API_BASE_URL}/api/reservas/${reservaSel.reserva_id}/checkout`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pagos, staffId: null }),
      });
      const data = await resp.json();
      if (data.error) throw new Error(data.error);
      setResultadoOk({ nombre: reservaSel.nombre_completo, codigo: reservaSel.codigo, pagos });
    } catch (err) {
      setErrorEnvio(err.message);
    } finally {
      setEnviando(false);
    }
  }

  if (resultadoOk) {
    return (
      <div style={{ minHeight: "100vh", background: T.bg, color: T.ivory, padding: "24px 20px" }}>
        <div style={{ maxWidth: 480, margin: "60px auto 0", textAlign: "center" }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>✓</div>
          <div style={{ fontSize: 20, fontWeight: 700, marginBottom: 6, color: T.green }}>Cuenta cerrada</div>
          <div style={{ color: T.ivoryMuted, fontSize: 14, marginBottom: 20 }}>{resultadoOk.codigo} — {resultadoOk.nombre}</div>
          <div style={{ background: T.card, border: `1px solid ${T.cardBorder}`, borderRadius: 14, padding: 18, textAlign: "left", marginBottom: 24 }}>
            {resultadoOk.pagos.map((p, i) => (
              <div key={i} style={{ padding: "6px 0", borderBottom: i < resultadoOk.pagos.length - 1 ? `1px solid ${T.cardBorder}` : "none" }}>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13.5 }}>
                  <span style={{ textTransform: "capitalize" }}>{p.concepto} · {METODOS.find(m => m.valor === p.metodoPago)?.label}</span>
                  <span style={{ fontWeight: 700, color: T.gold }}>{p.moneda === "USD" ? "US$" : "S/."} {fmt(p.monto)}</span>
                </div>
                {p.detalleMixto && (
                  <div style={{ fontSize: 11.5, color: T.ivoryMuted, marginTop: 4 }}>
                    {p.detalleMixto.map((d, j) => (
                      <div key={j}>· {METODOS_MIXTO.find(m => m.valor === d.metodo)?.label}: {p.moneda === "USD" ? "US$" : "S/."} {fmt(d.monto)}</div>
                    ))}
                  </div>
                )}
              </div>
            ))}
          </div>
          <a href="index.html" style={{ display: "inline-block", background: T.gold, color: "#1C1A20", padding: "12px 28px", borderRadius: 8, textDecoration: "none", fontWeight: 700, fontSize: 14 }}>Volver al panel</a>
        </div>
      </div>
    );
  }

  return (
    <div style={{ minHeight: "100vh", background: T.bg, color: T.ivory, padding: "24px 20px 60px" }}>
      <div style={{ maxWidth: 560, margin: "0 auto" }}>

        <a href="index.html" style={{ color: T.ivoryMuted, fontSize: 12.5, textDecoration: "none" }}>← Volver al panel</a>
        <div style={{ fontSize: 18, fontWeight: 600, margin: "10px 0 20px" }}>Check-out / Cierre de cuenta</div>

        <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
          <button onClick={() => setModo("checkout")} style={tabEstilo(modo === "checkout")}>Cerrar cuenta</button>
          <button onClick={() => setModo("corregir")} style={tabEstilo(modo === "corregir")}>Corregir un pago anterior</button>
        </div>

        {modo === "corregir" ? (
          <CorregirPago />
        ) : (
        <React.Fragment>

        {idBloqueado ? (
          <div style={{ marginBottom: 20 }}>
            {cargando ? (
              <div style={{ color: T.ivoryMuted, fontSize: 13 }}>Cargando huésped...</div>
            ) : noEncontrado ? (
              <div style={{ background: "rgba(184,63,50,0.12)", border: "1px solid #A83E32", color: "#D98A7D", borderRadius: 10, padding: "10px 14px", fontSize: 13 }}>
                No se encontró esta reserva entre los huéspedes en casa hoy.
              </div>
            ) : reservaSel && (
              <div style={{ background: "rgba(201,162,75,0.10)", border: `2px solid ${T.gold}`, borderRadius: 10, padding: "12px 14px" }}>
                <div style={{ fontSize: 11, color: T.ivoryMuted, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 3 }}>Cerrando cuenta de</div>
                <div style={{ fontSize: 15, fontWeight: 700 }}>{reservaSel.codigo} — {reservaSel.nombre_completo || "Por confirmar"}</div>
              </div>
            )}
          </div>
        ) : (
          <React.Fragment>
            <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 8 }}>1. Selecciona huésped</div>
            {cargando ? (
              <div style={{ color: T.ivoryMuted, fontSize: 13, marginBottom: 20 }}>Cargando huéspedes en casa...</div>
            ) : huespedes.length === 0 ? (
              <div style={{ color: T.ivoryMuted, fontSize: 13, marginBottom: 20 }}>No hay huéspedes en casa hoy.</div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 20 }}>
                {huespedes.map((h) => (
                  <button key={h.reserva_id} onClick={() => setReservaSel(h)} style={{
                    textAlign: "left", padding: "10px 14px", borderRadius: 10, cursor: "pointer",
                    border: reservaSel?.reserva_id === h.reserva_id ? `2px solid ${T.gold}` : `1px solid ${T.cardBorder}`,
                    background: reservaSel?.reserva_id === h.reserva_id ? "rgba(201,162,75,0.15)" : T.card,
                    color: T.ivory, fontSize: 13.5,
                  }}>
                    <strong>{h.codigo}</strong> — {h.nombre_completo || "Por confirmar"}
                  </button>
                ))}
              </div>
            )}
          </React.Fragment>
        )}

        {reservaSel && cargandoFolio && (
          <div style={{ color: T.ivoryMuted, fontSize: 13 }}>Cargando folio...</div>
        )}

        {reservaSel && errorFolio && (
          <div style={{ background: "rgba(184,63,50,0.12)", border: "1px solid #A83E32", color: "#D98A7D", borderRadius: 10, padding: "10px 14px", fontSize: 13 }}>
            {errorFolio}
          </div>
        )}

        {reservaSel && folio && !cargandoFolio && (
          <React.Fragment>

            <div style={{ color: T.ivoryMuted, fontSize: 12, marginBottom: 18 }}>
              Tipo de cambio referencial de hoy: <strong style={{ color: T.ivory }}>S/ {fmt(tipoCambioRef)}</strong> por US$ 1
            </div>

            {/* HOSPEDAJE */}
            <div style={{ background: T.card, border: `1px solid ${T.cardBorder}`, borderRadius: 14, padding: 16, marginBottom: 14 }}>
              <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 8 }}>🏕️ Hospedaje</div>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: T.ivoryMuted, marginBottom: 10 }}>
                <span>US$ {fmt(hospedajeUsd)}</span>
                <span>≈ S/ {fmt(hospedajeSoles)}</span>
              </div>
              {aplicarAdelantoA === "hospedaje" && adelantoMonto > 0 && (
                <div style={{ fontSize: 11.5, color: T.green, marginBottom: 8 }}>
                  − Adelanto aplicado: US$ {fmt(adelantoUsd)} → saldo US$ {fmt(saldoHospedajeUsd)}
                </div>
              )}
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 10 }}>
                <div style={{ fontSize: 12, color: T.ivoryMuted }}>Cobrar en:</div>
                <BotonMoneda moneda={monedaHospedaje} onChange={setMonedaHospedaje} />
              </div>

              {usaTipoCambioHospedaje && hayHospedajeQueCobrar && (
                <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 10 }}>
                  <span style={{ fontSize: 11.5, color: T.amber, flex: 1 }}>Tipo de cambio (venta) — S/ por US$1:</span>
                  <input type="number" min="0" step="0.001" value={tipoCambioHospedaje}
                    onChange={(e) => setTipoCambioHospedaje(e.target.value)}
                    style={{
                      width: 90, background: T.bg, border: `1px solid ${tipoCambioHospedajeOk ? T.cardBorder : T.red}`,
                      borderRadius: 6, padding: "6px 8px", color: T.ivory, fontSize: 13,
                    }} />
                </div>
              )}

              <div style={{ fontSize: 20, fontWeight: 700, color: T.gold, textAlign: "right", margin: "8px 0" }}>
                {monedaHospedaje === "USD" ? "US$" : "S/."} {fmt(montoCobroHospedaje)}
              </div>
              {hayHospedajeQueCobrar && (
                <React.Fragment>
                  <SelectorMetodo valor={metodoHospedaje} onChange={setMetodoHospedaje} />
                  {metodoHospedaje === "mixto" && (
                    <DesgloseMixto partes={mixtoHospedaje} onChange={setMixtoHospedaje}
                      total={round2(montoCobroHospedaje)} simbolo={monedaHospedaje === "USD" ? "US$" : "S/."} />
                  )}
                </React.Fragment>
              )}
              {!hayHospedajeQueCobrar && <div style={{ fontSize: 12, color: T.green }}>Cubierto por adelanto</div>}
            </div>

            {/* CONSUMO */}
            <div style={{ background: T.card, border: `1px solid ${T.cardBorder}`, borderRadius: 14, padding: 16, marginBottom: 14 }}>
              <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 8 }}>🍽️ Consumo</div>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: T.ivoryMuted, marginBottom: 4 }}>
                <span>S/ {fmt(consumoSoles)}</span>
                <span>≈ US$ {fmt(consumoUsd)}</span>
              </div>
              {Object.keys(folio.desglosePorCategoria || {}).length > 0 && (
                <div style={{ fontSize: 11, color: T.ivoryMuted, marginBottom: 10 }}>
                  {Object.entries(folio.desglosePorCategoria).map(([cat, monto]) => (
                    <div key={cat}>· {cat}: S/ {fmt(monto)}</div>
                  ))}
                </div>
              )}
              {aplicarAdelantoA === "consumo" && adelantoMonto > 0 && (
                <div style={{ fontSize: 11.5, color: T.green, marginBottom: 8 }}>
                  − Adelanto aplicado: S/ {fmt(adelantoSoles)} → saldo S/ {fmt(saldoConsumoSoles)}
                </div>
              )}
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 10 }}>
                <div style={{ fontSize: 12, color: T.ivoryMuted }}>Cobrar en:</div>
                <BotonMoneda moneda={monedaConsumo} onChange={setMonedaConsumo} />
              </div>

              {usaTipoCambioConsumo && hayConsumoQueCobrar && (
                <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 10 }}>
                  <span style={{ fontSize: 11.5, color: T.amber, flex: 1 }}>Tipo de cambio (compra) — S/ por US$1:</span>
                  <input type="number" min="0" step="0.001" value={tipoCambioConsumo}
                    onChange={(e) => setTipoCambioConsumo(e.target.value)}
                    style={{
                      width: 90, background: T.bg, border: `1px solid ${tipoCambioConsumoOk ? T.cardBorder : T.red}`,
                      borderRadius: 6, padding: "6px 8px", color: T.ivory, fontSize: 13,
                    }} />
                </div>
              )}

              <div style={{ fontSize: 20, fontWeight: 700, color: T.gold, textAlign: "right", margin: "8px 0" }}>
                {monedaConsumo === "USD" ? "US$" : "S/."} {fmt(montoCobroConsumo)}
              </div>
              {hayConsumoQueCobrar && (
                <React.Fragment>
                  <SelectorMetodo valor={metodoConsumo} onChange={setMetodoConsumo} />
                  {metodoConsumo === "mixto" && (
                    <DesgloseMixto partes={mixtoConsumo} onChange={setMixtoConsumo}
                      total={round2(montoCobroConsumo)} simbolo={monedaConsumo === "USD" ? "US$" : "S/."} />
                  )}
                </React.Fragment>
              )}
              {!hayConsumoQueCobrar && <div style={{ fontSize: 12, color: T.green }}>Cubierto por adelanto</div>}
            </div>

            {/* ADELANTO — siempre en USD */}
            <div style={{ background: T.card, border: `1px solid ${T.cardBorder}`, borderRadius: 14, padding: 16, marginBottom: 20 }}>
              <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 10 }}>💰 Adelanto ya pagado (US$)</div>
              <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 10 }}>
                <span style={{ fontSize: 14, color: T.ivoryMuted }}>US$</span>
                <input type="number" min="0" step="0.01" value={adelantoMonto}
                  onChange={(e) => setAdelantoMonto(Number(e.target.value) || 0)}
                  style={{
                    flex: 1, background: T.bg, border: `1px solid ${T.cardBorder}`, borderRadius: 8,
                    padding: "9px 12px", color: T.ivory, fontSize: 14,
                  }} />
              </div>
              <div style={{ fontSize: 12, color: T.ivoryMuted, marginBottom: 8 }}>Aplicar este adelanto a:</div>
              <div style={{ display: "flex", gap: 6 }}>
                {[
                  { valor: "hospedaje", label: "Hospedaje" },
                  { valor: "consumo", label: "Consumo" },
                  { valor: "ninguno", label: "Ninguno" },
                ].map((op) => (
                  <button key={op.valor} onClick={() => setAplicarAdelantoA(op.valor)} style={{
                    flex: 1, padding: "8px 0", borderRadius: 8, cursor: "pointer", fontSize: 12, fontWeight: 600,
                    border: aplicarAdelantoA === op.valor ? `2px solid ${T.gold}` : `1px solid ${T.cardBorder}`,
                    background: aplicarAdelantoA === op.valor ? "rgba(201,162,75,0.15)" : T.bg,
                    color: aplicarAdelantoA === op.valor ? T.gold : T.ivoryMuted,
                  }}>{op.label}</button>
                ))}
              </div>
            </div>

            {errorEnvio && (
              <div style={{ background: "rgba(184,63,50,0.12)", border: "1px solid #A83E32", color: "#D98A7D", borderRadius: 10, padding: "10px 14px", fontSize: 13, marginBottom: 14 }}>
                Error: {errorEnvio}
              </div>
            )}

            <button onClick={confirmarCheckout} disabled={enviando || !puedeEnviar} style={{
              width: "100%", background: (enviando || !puedeEnviar) ? T.cardBorder : T.gold,
              color: (enviando || !puedeEnviar) ? T.ivoryMuted : "#1C1A20", border: "none", borderRadius: 10,
              padding: "15px 0", fontSize: 15, fontWeight: 700, cursor: (enviando || !puedeEnviar) ? "not-allowed" : "pointer",
            }}>
              {enviando ? "Procesando..." : puedeEnviar ? "✓ Cerrar cuenta" : "Revisa los montos antes de continuar"}
            </button>
          </React.Fragment>
        )}

        </React.Fragment>
        )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CheckoutPantalla />);
</script>
</body>
</html>
