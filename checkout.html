<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Miski Samay — Check-out</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const T = {
  bg: "#0E0D0F", card: "#1C1A20", cardBorder: "#2A2730",
  gold: "#C9A24B", ivory: "#EFEAE1", ivoryMuted: "#9B968E",
  green: "#6B8F71", red: "#A83E32", amber: "#B8873B",
};

const API_BASE_URL = "https://miski-samay-backend-production.up.railway.app";

const METODOS = [
  { valor: "efectivo", label: "Efectivo" },
  { valor: "pos", label: "Tarjeta / POS" },
  { valor: "transferencia", label: "Transferencia" },
  { valor: "mixto", label: "Mixto" },
];

const idBloqueado = new URLSearchParams(window.location.search).get("id");

function fmt(n) {
  return Number(n || 0).toFixed(2);
}
function round2(n) {
  return Math.round((Number(n) || 0) * 100) / 100;
}

function BotonMoneda({ moneda, onChange }) {
  return (
    <div style={{ display: "flex", gap: 6 }}>
      {["USD", "PEN"].map((m) => (
        <button key={m} onClick={() => onChange(m)} style={{
          padding: "6px 12px", borderRadius: 8, cursor: "pointer", fontSize: 12, fontWeight: 700,
          border: moneda === m ? `2px solid ${T.gold}` : `1px solid ${T.cardBorder}`,
          background: moneda === m ? "rgba(201,162,75,0.15)" : T.bg,
          color: moneda === m ? T.gold : T.ivoryMuted,
        }}>
          {m === "USD" ? "US$" : "S/."}
        </button>
      ))}
    </div>
  );
}

function SelectorMetodo({ valor, onChange }) {
  return (
    <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
      {METODOS.map((m) => (
        <button key={m.valor} onClick={() => onChange(m.valor)} style={{
          padding: "6px 10px", borderRadius: 8, cursor: "pointer", fontSize: 11.5, fontWeight: 600,
          border: valor === m.valor ? `2px solid ${T.gold}` : `1px solid ${T.cardBorder}`,
          background: valor === m.valor ? "rgba(201,162,75,0.15)" : T.bg,
          color: valor === m.valor ? T.gold : T.ivoryMuted,
        }}>
          {m.label}
        </button>
      ))}
    </div>
  );
}

function CheckoutPantalla() {
  const [huespedes, setHuespedes] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [reservaSel, setReservaSel] = useState(null);
  const [noEncontrado, setNoEncontrado] = useState(false);

  const [folio, setFolio] = useState(null);
  const [cargandoFolio, setCargandoFolio] = useState(false);
  const [errorFolio, setErrorFolio] = useState(null);

  const [adelantoMonto, setAdelantoMonto] = useState(0);
  const [adelantoMoneda, setAdelantoMoneda] = useState("PEN");
  const [aplicarAdelantoA, setAplicarAdelantoA] = useState("ninguno");

  const [monedaHospedaje, setMonedaHospedaje] = useState("USD");
  const [monedaConsumo, setMonedaConsumo] = useState("PEN");
  const [metodoHospedaje, setMetodoHospedaje] = useState("efectivo");
  const [metodoConsumo, setMetodoConsumo] = useState("efectivo");

  const [enviando, setEnviando] = useState(false);
  const [resultadoOk, setResultadoOk] = useState(null);
  const [errorEnvio, setErrorEnvio] = useState(null);

  useEffect(() => {
    fetch(`${API_BASE_URL}/api/domos/estado-hoy`)
      .then(r => r.json())
      .then(data => {
        const lista = Array.isArray(data) ? data : [];
        setHuespedes(lista);
        if (idBloqueado) {
          const encontrado = lista.find(h => h.reserva_id === idBloqueado);
          if (encontrado) setReservaSel(encontrado);
          else setNoEncontrado(true);
        }
        setCargando(false);
      })
      .catch(() => setCargando(false));
  }, []);

  useEffect(() => {
    if (!reservaSel) return;
    setCargandoFolio(true);
    setErrorFolio(null);
    setFolio(null);
    fetch(`${API_BASE_URL}/api/reservas/${reservaSel.reserva_id}/folio`)
      .then(r => r.json())
      .then(data => {
        if (data.error) { setErrorFolio(data.error); setCargandoFolio(false); return; }
        setFolio(data);
        setAdelantoMonto(Number(data.adelanto.monto) || 0);
        setAplicarAdelantoA(Number(data.adelanto.monto) > 0 ? "hospedaje" : "ninguno");
        setCargandoFolio(false);
      })
      .catch(() => { setErrorFolio("No se pudo cargar el folio"); setCargandoFolio(false); });
  }, [reservaSel]);

  const tipoCambio = folio?.tipoCambio || null;
  const hospedajeUsd = folio ? Number(folio.hospedaje.montoUsd) || 0 : 0;
  const hospedajeSoles = tipoCambio ? hospedajeUsd * tipoCambio : 0;
  const consumoSoles = folio ? Number(folio.consumo.montoSoles) || 0 : 0;
  const consumoUsd = tipoCambio ? consumoSoles / tipoCambio : 0;

  const adelantoUsd = adelantoMoneda === "USD" ? adelantoMonto : (tipoCambio ? adelantoMonto / tipoCambio : 0);
  const adelantoSoles = adelantoMoneda === "PEN" ? adelantoMonto : (tipoCambio ? adelantoMonto * tipoCambio : 0);

  const saldoHospedajeUsd = aplicarAdelantoA === "hospedaje" ? Math.max(0, hospedajeUsd - adelantoUsd) : hospedajeUsd;
  const saldoConsumoSoles = aplicarAdelantoA === "consumo" ? Math.max(0, consumoSoles - adelantoSoles) : consumoSoles;
  const saldoHospedajeSoles = tipoCambio ? saldoHospedajeUsd * tipoCambio : 0;
  const saldoConsumoUsd = tipoCambio ? saldoConsumoSoles / tipoCambio : 0;

  const montoCobroHospedaje = monedaHospedaje === "USD" ? saldoHospedajeUsd : saldoHospedajeSoles;
  const montoCobroConsumo = monedaConsumo === "PEN" ? saldoConsumoSoles : saldoConsumoUsd;

  const hayHospedajeQueCobar = montoCobroHospedaje > 0.009;
  const hayConsumoQueCobrar = montoCobroConsumo > 0.009;

  async function confirmarCheckout() {
    const pagos = [];
    if (hayHospedajeQueCobar) {
      pagos.push({ concepto: "hospedaje", monto: round2(montoCobroHospedaje), moneda: monedaHospedaje, metodoPago: metodoHospedaje, tipoCambio });
    }
    if (hayConsumoQueCobrar) {
      pagos.push({ concepto: "consumo", monto: round2(montoCobroConsumo), moneda: monedaConsumo, metodoPago: metodoConsumo, tipoCambio });
    }
    if (pagos.length === 0) {
      alert("No hay saldo pendiente por cobrar (el adelanto cubre todo). Contacta soporte si esto no es correcto.");
      return;
    }

    setEnviando(true);
    setErrorEnvio(null);
    try {
      const resp = await fetch(`${API_BASE_URL}/api/reservas/${reservaSel.reserva_id}/checkout`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pagos, staffId: null }),
      });
      const data = await resp.json();
      if (data.error) throw new Error(data.error);
      setResultadoOk({ nombre: reservaSel.nombre_completo, codigo: reservaSel.codigo, pagos });
    } catch (err) {
      setErrorEnvio(err.message);
    } finally {
      setEnviando(false);
    }
  }

  if (resultadoOk) {
    return (
      <div style={{ minHeight: "100vh", background: T.bg, color: T.ivory, padding: "24px 20px" }}>
        <div style={{ maxWidth: 480, margin: "60px auto 0", textAlign: "center" }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>✓</div>
          <div style={{ fontSize: 20, fontWeight: 700, marginBottom: 6, color: T.green }}>Cuenta cerrada</div>
          <div style={{ color: T.ivoryMuted, fontSize: 14, marginBottom: 20 }}>{resultadoOk.codigo} — {resultadoOk.nombre}</div>
          <div style={{ background: T.card, border: `1px solid ${T.cardBorder}`, borderRadius: 14, padding: 18, textAlign: "left", marginBottom: 24 }}>
            {resultadoOk.pagos.map((p, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", fontSize: 13.5, padding: "6px 0", borderBottom: i < resultadoOk.pagos.length - 1 ? `1px solid ${T.cardBorder}` : "none" }}>
                <span style={{ textTransform: "capitalize" }}>{p.concepto} · {METODOS.find(m => m.valor === p.metodoPago)?.label}</span>
                <span style={{ fontWeight: 700, color: T.gold }}>{p.moneda === "USD" ? "US$" : "S/."} {fmt(p.monto)}</span>
              </div>
            ))}
          </div>
          <a href="index.html" style={{ display: "inline-block", background: T.gold, color: "#1C1A20", padding: "12px 28px", borderRadius: 8, textDecoration: "none", fontWeight: 700, fontSize: 14 }}>Volver al panel</a>
        </div>
      </div>
    );
  }

  return (
    <div style={{ minHeight: "100vh", background: T.bg, color: T.ivory, padding: "24px 20px 60px" }}>
      <div style={{ maxWidth: 560, margin: "0 auto" }}>

        <a href="index.html" style={{ color: T.ivoryMuted, fontSize: 12.5, textDecoration: "none" }}>← Volver al panel</a>
        <div style={{ fontSize: 18, fontWeight: 600, margin: "10px 0 20px" }}>Check-out / Cierre de cuenta</div>

        {idBloqueado ? (
          <div style={{ marginBottom: 20 }}>
            {cargando ? (
              <div style={{ color: T.ivoryMuted, fontSize: 13 }}>Cargando huésped...</div>
            ) : noEncontrado ? (
              <div style={{ background: "rgba(184,63,50,0.12)", border: "1px solid #A83E32", color: "#D98A7D", borderRadius: 10, padding: "10px 14px", fontSize: 13 }}>
                No se encontró esta reserva entre los huéspedes en casa hoy.
              </div>
            ) : reservaSel && (
              <div style={{ background: "rgba(201,162,75,0.10)", border: `2px solid ${T.gold}`, borderRadius: 10, padding: "12px 14px" }}>
                <div style={{ fontSize: 11, color: T.ivoryMuted, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 3 }}>Cerrando cuenta de</div>
                <div style={{ fontSize: 15, fontWeight: 700 }}>{reservaSel.codigo} — {reservaSel.nombre_completo || "Por confirmar"}</div>
              </div>
            )}
          </div>
        ) : (
          <React.Fragment>
            <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 8 }}>1. Selecciona huésped</div>
            {cargando ? (
              <div style={{ color: T.ivoryMuted, fontSize: 13, marginBottom: 20 }}>Cargando huéspedes en casa...</div>
            ) : huespedes.length === 0 ? (
              <div style={{ color: T.ivoryMuted, fontSize: 13, marginBottom: 20 }}>No hay huéspedes en casa hoy.</div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 20 }}>
                {huespedes.map((h) => (
                  <button key={h.reserva_id} onClick={() => setReservaSel(h)} style={{
                    textAlign: "left", padding: "10px 14px", borderRadius: 10, cursor: "pointer",
                    border: reservaSel?.reserva_id === h.reserva_id ? `2px solid ${T.gold}` : `1px solid ${T.cardBorder}`,
                    background: reservaSel?.reserva_id === h.reserva_id ? "rgba(201,162,75,0.15)" : T.card,
                    color: T.ivory, fontSize: 13.5,
                  }}>
                    <strong>{h.codigo}</strong> — {h.nombre_completo || "Por confirmar"}
                  </button>
                ))}
              </div>
            )}
          </React.Fragment>
        )}

        {reservaSel && cargandoFolio && (
          <div style={{ color: T.ivoryMuted, fontSize: 13 }}>Cargando folio...</div>
        )}

        {reservaSel && errorFolio && (
          <div style={{ background: "rgba(184,63,50,0.12)", border: "1px solid #A83E32", color: "#D98A7D", borderRadius: 10, padding: "10px 14px", fontSize: 13 }}>
            {errorFolio}
          </div>
        )}

        {reservaSel && folio && !cargandoFolio && (
          <React.Fragment>

            <div style={{ color: T.ivoryMuted, fontSize: 12, marginBottom: 18 }}>
              Tipo de cambio de hoy: <strong style={{ color: T.ivory }}>S/ {fmt(tipoCambio)}</strong> por US$ 1
            </div>

            {/* HOSPEDAJE */}
            <div style={{ background: T.card, border: `1px solid ${T.cardBorder}`, borderRadius: 14, padding: 16, marginBottom: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                <div style={{ fontSize: 14, fontWeight: 700 }}>🏕️ Hospedaje</div>
                {folio.hospedaje.montoEsEstimado && (
                  <span style={{ fontSize: 10.5, color: T.amber, background: "rgba(184,135,59,0.15)", padding: "3px 8px", borderRadius: 6, fontWeight: 700 }}>MONTO ESTIMADO</span>
                )}
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: T.ivoryMuted, marginBottom: 10 }}>
                <span>US$ {fmt(hospedajeUsd)}</span>
                <span>≈ S/ {fmt(hospedajeSoles)}</span>
              </div>
              {aplicarAdelantoA === "hospedaje" && adelantoMonto > 0 && (
                <div style={{ fontSize: 11.5, color: T.green, marginBottom: 8 }}>
                  − Adelanto aplicado: US$ {fmt(adelantoUsd)} → saldo US$ {fmt(saldoHospedajeUsd)}
                </div>
              )}
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 10 }}>
                <div style={{ fontSize: 12, color: T.ivoryMuted }}>Cobrar en:</div>
                <BotonMoneda moneda={monedaHospedaje} onChange={setMonedaHospedaje} />
              </div>
              <div style={{ fontSize: 20, fontWeight: 700, color: T.gold, textAlign: "right", margin: "8px 0" }}>
                {monedaHospedaje === "USD" ? "US$" : "S/."} {fmt(montoCobroHospedaje)}
              </div>
              {hayHospedajeQueCobar && (
                <SelectorMetodo valor={metodoHospedaje} onChange={setMetodoHospedaje} />
              )}
              {!hayHospedajeQueCobar && <div style={{ fontSize: 12, color: T.green }}>Cubierto por adelanto</div>}
            </div>

            {/* CONSUMO */}
            <div style={{ background: T.card, border: `1px solid ${T.cardBorder}`, borderRadius: 14, padding: 16, marginBottom: 14 }}>
              <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 8 }}>🍽️ Consumo</div>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: T.ivoryMuted, marginBottom: 4 }}>
                <span>S/ {fmt(consumoSoles)}</span>
                <span>≈ US$ {fmt(consumoUsd)}</span>
              </div>
              {Object.keys(folio.consumo.desglosePorCategoria || {}).length > 0 && (
                <div style={{ fontSize: 11, color: T.ivoryMuted, marginBottom: 10 }}>
                  {Object.entries(folio.consumo.desglosePorCategoria).map(([cat, monto]) => (
                    <div key={cat}>· {cat}: S/ {fmt(monto)}</div>
                  ))}
                </div>
              )}
              {aplicarAdelantoA === "consumo" && adelantoMonto > 0 && (
                <div style={{ fontSize: 11.5, color: T.green, marginBottom: 8 }}>
                  − Adelanto aplicado: S/ {fmt(adelantoSoles)} → saldo S/ {fmt(saldoConsumoSoles)}
                </div>
              )}
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 10 }}>
                <div style={{ fontSize: 12, color: T.ivoryMuted }}>Cobrar en:</div>
                <BotonMoneda moneda={monedaConsumo} onChange={setMonedaConsumo} />
              </div>
              <div style={{ fontSize: 20, fontWeight: 700, color: T.gold, textAlign: "right", margin: "8px 0" }}>
                {monedaConsumo === "USD" ? "US$" : "S/."} {fmt(montoCobroConsumo)}
              </div>
              {hayConsumoQueCobrar && (
                <SelectorMetodo valor={metodoConsumo} onChange={setMetodoConsumo} />
              )}
              {!hayConsumoQueCobrar && <div style={{ fontSize: 12, color: T.green }}>Cubierto por adelanto</div>}
            </div>

            {/* ADELANTO */}
            <div style={{ background: T.card, border: `1px solid ${T.cardBorder}`, borderRadius: 14, padding: 16, marginBottom: 20 }}>
              <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 10 }}>💰 Adelanto ya pagado</div>
              <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 10 }}>
                <input type="number" min="0" step="0.01" value={adelantoMonto}
                  onChange={(e) => setAdelantoMonto(Number(e.target.value) || 0)}
                  style={{
                    flex: 1, background: T.bg, border: `1px solid ${T.cardBorder}`, borderRadius: 8,
                    padding: "9px 12px", color: T.ivory, fontSize: 14,
                  }} />
                <BotonMoneda moneda={adelantoMoneda} onChange={setAdelantoMoneda} />
              </div>
              <div style={{ fontSize: 12, color: T.ivoryMuted, marginBottom: 8 }}>Aplicar este adelanto a:</div>
              <div style={{ display: "flex", gap: 6 }}>
                {[
                  { valor: "hospedaje", label: "Hospedaje" },
                  { valor: "consumo", label: "Consumo" },
                  { valor: "ninguno", label: "Ninguno" },
                ].map((op) => (
                  <button key={op.valor} onClick={() => setAplicarAdelantoA(op.valor)} style={{
                    flex: 1, padding: "8px 0", borderRadius: 8, cursor: "pointer", fontSize: 12, fontWeight: 600,
                    border: aplicarAdelantoA === op.valor ? `2px solid ${T.gold}` : `1px solid ${T.cardBorder}`,
                    background: aplicarAdelantoA === op.valor ? "rgba(201,162,75,0.15)" : T.bg,
                    color: aplicarAdelantoA === op.valor ? T.gold : T.ivoryMuted,
                  }}>{op.label}</button>
                ))}
              </div>
            </div>

            {errorEnvio && (
              <div style={{ background: "rgba(184,63,50,0.12)", border: "1px solid #A83E32", color: "#D98A7D", borderRadius: 10, padding: "10px 14px", fontSize: 13, marginBottom: 14 }}>
                Error: {errorEnvio}
              </div>
            )}

            <button onClick={confirmarCheckout} disabled={enviando} style={{
              width: "100%", background: T.gold, color: "#1C1A20", border: "none", borderRadius: 10,
              padding: "15px 0", fontSize: 15, fontWeight: 700, cursor: "pointer",
            }}>
              {enviando ? "Procesando..." : "✓ Cerrar cuenta"}
            </button>
          </React.Fragment>
        )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CheckoutPantalla />);
</script>
</body>
</html>
