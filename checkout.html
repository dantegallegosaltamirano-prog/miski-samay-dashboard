  // concepto) — si hospedaje y consumo terminan en la misma moneda, comparten
  // un solo número de comprobante.
  //
  // Solo se arma si esta persona tiene permiso de emitir boletas/facturas
  // (sesion.puede_emitir_comprobantes) — si no lo tiene, esto queda vacío a
  // propósito: el check-out se cierra igual (se cobra y se guarda el pago),
  // pero SIN llamar a HaylliERP/SUNAT. Alguien con permiso lo emite después
  // desde "Corregir un pago anterior" → "+ Agregar comprobante".
  const gruposComprobantePorMoneda = {};
  if (puedeEmitir) {
    if (hayHospedajeQueCobrar) {
      (gruposComprobantePorMoneda[monedaHospedaje] = gruposComprobantePorMoneda[monedaHospedaje] || []).push("Hospedaje");
    }
    if (hayConsumoQueCobrar) {
      (gruposComprobantePorMoneda[monedaConsumo] = gruposComprobantePorMoneda[monedaConsumo] || []).push("Consumo");
    }
  }

  const sumaMixtoHospedaje = mixtoHospedaje.reduce((a, p) => a + (Number(p.monto) || 0), 0);
  const sumaMixtoConsumo = mixtoConsumo.reduce((a, p) => a + (Number(p.monto) || 0), 0);
  const mixtoHospedajeOk = metodoHospedaje !== "mixto" || !hayHospedajeQueCobrar || Math.abs(sumaMixtoHospedaje - round2(montoCobroHospedaje)) < 0.01;
  const mixtoConsumoOk = metodoConsumo !== "mixto" || !hayConsumoQueCobrar || Math.abs(sumaMixtoConsumo - round2(montoCobroConsumo)) < 0.01;

  const tipoCambioHospedajeOk = !usaTipoCambioHospedaje || !hayHospedajeQueCobrar || Number(tipoCambioHospedaje) > 0;
  const tipoCambioConsumoOk = !usaTipoCambioConsumo || !hayConsumoQueCobrar || Number(tipoCambioConsumo) > 0;

  const puedeEnviar = mixtoHospedajeOk && mixtoConsumoOk && tipoCambioHospedajeOk && tipoCambioConsumoOk;

  function construirPagos() {
    const pagos = [];
    if (hayHospedajeQueCobrar) {
      const linea = { concepto: "hospedaje", monto: round2(montoCobroHospedaje), moneda: monedaHospedaje, metodoPago: metodoHospedaje };
      if (usaTipoCambioHospedaje) linea.tipoCambio = Number(tipoCambioHospedaje);
      if (metodoHospedaje === "mixto") {
        linea.detalleMixto = mixtoHospedaje.map(p => ({ metodo: p.metodo, monto: round2(Number(p.monto) || 0) }));
      }
      if (gruposComprobantePorMoneda[monedaHospedaje]) {
        linea.tipoComprobante = tipoComprobante;
        if (tipoComprobante === "factura") {
          linea.facturaRuc = facturaRuc.trim();
          linea.facturaRazonSocial = facturaRazonSocial.trim();
        }
      }
      pagos.push(linea);
    }
    if (hayConsumoQueCobrar) {
      const linea = { concepto: "consumo", monto: round2(montoCobroConsumo), moneda: monedaConsumo, metodoPago: metodoConsumo };
      if (usaTipoCambioConsumo) linea.tipoCambio = Number(tipoCambioConsumo);
      if (metodoConsumo === "mixto") {
        linea.detalleMixto = mixtoConsumo.map(p => ({ metodo: p.metodo, monto: round2(Number(p.monto) || 0) }));
      }
      if (gruposComprobantePorMoneda[monedaConsumo]) {
        linea.tipoComprobante = tipoComprobante;
        if (tipoComprobante === "factura") {
          linea.facturaRuc = facturaRuc.trim();
          linea.facturaRazonSocial = facturaRazonSocial.trim();
        }
      }
      pagos.push(linea);
    }
    return pagos;
  }

  const hayComprobantePorEmitir = Object.keys(gruposComprobantePorMoneda).length > 0;
  const facturaDatosOk = tipoComprobante !== "factura" || !hayComprobantePorEmitir
    || (facturaRuc.trim().length === 11 && facturaRazonSocial.trim().length > 0);

  function irAVistaPrevia() {
    const pagos = construirPagos();
    if (pagos.length === 0) {
      alert("No hay saldo pendiente por cobrar (el adelanto cubre todo). Contacta soporte si esto no es correcto.");
      return;
    }
    if (!puedeEnviar) {
      alert("Revisa el desglose de pago mixto o el tipo de cambio antes de continuar — hay algo que no cuadra.");
      return;
    }
    if (!facturaDatosOk) {
      alert("Para emitir factura, ingresa un RUC de 11 dígitos y la razón social.");
      return;
    }
    // Sin comprobante que emitir (sin permiso para facturar, o el adelanto
    // ya cubrió todo) — cerrar la cuenta directo, sin mostrar una vista
    // previa vacía de un comprobante que no se va a emitir.
    if (!hayComprobantePorEmitir) {
      confirmarCheckout();
      return;
    }
    setVistaPreviaComprobante(true);
  }

  async function confirmarCheckout() {
    const pagos = construirPagos();
    setEnviando(true);
    setErrorEnvio(null);
    try {
      const resp = await fetch(`${API_BASE_URL}/api/reservas/${reservaSel.reserva_id}/checkout`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pagos, staffId: null, fechaEmision: fechaEmision.trim() || undefined }),
      });
      const data = await resp.json();
      if (data.error) throw new Error(data.error);
      setResultadoOk({ nombre: reservaSel.nombre_completo, codigo: reservaSel.codigo, pagos, comprobantes: data.comprobantes || [] });
    } catch (err) {
      setErrorEnvio(err.message);
    } finally {
      setEnviando(false);
    }
  }

  function descripcionItemPreview(concepto) {
    const c = folio?.cliente || {};
    if (concepto === "hospedaje") {
      // Debe coincidir con haylliDescripcionItem() en el servidor (bug
      // corregido 31 ago: antes se pegaban las fechas crudas y salían en
      // inglés con zona horaria) — aquí mostramos lo mismo que se va a
      // enviar de verdad: fechas formateadas (DD/MM/AAAA) + noches, para
      // evitar malas interpretaciones (pedido de Dante).
      let noches = null;
      let desdeTexto = null;
      let hastaTexto = null;
      if (c.fechaLlegada && c.fechaSalida) {
        const desde = new Date(c.fechaLlegada);
        const hasta = new Date(c.fechaSalida);
        if (!isNaN(desde) && !isNaN(hasta)) {
          noches = Math.round((hasta - desde) / (1000 * 60 * 60 * 24));
          const opciones = { day: "2-digit", month: "2-digit", year: "numeric", timeZone: "UTC" };
          desdeTexto = desde.toLocaleDateString("es-PE", opciones);
          hastaTexto = hasta.toLocaleDateString("es-PE", opciones);
        }
      }
      const textoFechas = desdeTexto && hastaTexto ? ` del ${desdeTexto} al ${hastaTexto}` : "";
      const textoNoches = noches != null && noches > 0 ? ` — ${noches} noche${noches === 1 ? "" : "s"}` : "";
      return `Servicio de alojamiento (Domo ${c.domoCodigo || "?"})${textoFechas}${textoNoches}`;
    }
    return "Consumo en restaurante";
  }

  if (resultadoOk) {
    return (
      <div style={{ minHeight: "100vh", background: T.bg, color: T.ivory, padding: "24px 20px" }}>
        <div style={{ maxWidth: 480, margin: "60px auto 0", textAlign: "center" }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>✓</div>
          <div style={{ fontSize: 20, fontWeight: 700, marginBottom: 6, color: T.green }}>Cuenta cerrada</div>
          <div style={{ color: T.ivoryMuted, fontSize: 14, marginBottom: 20 }}>{resultadoOk.codigo} — {resultadoOk.nombre}</div>
          <div style={{ background: T.card, border: `1px solid ${T.cardBorder}`, borderRadius: 14, padding: 18, textAlign: "left", marginBottom: 24 }}>
            {resultadoOk.pagos.map((p, i) => (
              <div key={i} style={{ padding: "6px 0", borderBottom: i < resultadoOk.pagos.length - 1 ? `1px solid ${T.cardBorder}` : "none" }}>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13.5 }}>
                  <span style={{ textTransform: "capitalize" }}>{p.concepto} · {METODOS.find(m => m.valor === p.metodoPago)?.label}</span>
                  <span style={{ fontWeight: 700, color: T.gold }}>{p.moneda === "USD" ? "US$" : "S/."} {fmt(p.monto)}</span>
                </div>
                {p.detalleMixto && (
                  <div style={{ fontSize: 11.5, color: T.ivoryMuted, marginTop: 4 }}>
                    {p.detalleMixto.map((d, j) => (
                      <div key={j}>· {METODOS_MIXTO.find(m => m.valor === d.metodo)?.label}: {p.moneda === "USD" ? "US$" : "S/."} {fmt(d.monto)}</div>
                    ))}
                  </div>
                )}
                {p.tipoComprobante && (() => {
                  const c = (resultadoOk.comprobantes || []).find(x => x.concepto === p.concepto);
                  if (!c) return null;
                  if (c.ok) {
                    return (
                      <div style={{ marginTop: 6, textTransform: "none" }}>
                        <div style={{ fontSize: 11.5, color: T.ivoryMuted }}>
                          🧾 {c.tipoComprobante === "factura" ? "Factura" : "Boleta"} {c.numeroComprobante || ""}
                          {c.sunatStatus ? ` · SUNAT: ${c.sunatStatus}` : ""}
                        </div>
                        {c.pdfUrl && (
                          <a href={`${API_BASE_URL}/api/pagos/${c.pagoIds ? c.pagoIds[0] : ""}/comprobante-pdf`} target="_blank" rel="noopener noreferrer" className="no-imprimir"
                            style={{ display: "inline-block", marginTop: 6, fontSize: 12, fontWeight: 600, color: T.gold, textDecoration: "none", border: `1px solid ${T.gold}`, borderRadius: 6, padding: "5px 10px" }}>
                            🖨️ Guardar / imprimir comprobante
                          </a>
                        )}
                      </div>
                    );
                  }
                  return (
                    <div style={{ marginTop: 6, fontSize: 11.5, color: "#D98A7D", textTransform: "none" }}>
                      ⚠️ No se pudo emitir el comprobante automáticamente ({c.error || "error desconocido"}). El pago quedó registrado igual — reintenta desde "Corregir un pago anterior".
                    </div>
                  );
                })()}
              </div>
            ))}
          </div>
          <a href="index.html" style={{ display: "inline-block", background: T.gold, color: "#1C1A20", padding: "12px 28px", borderRadius: 8, textDecoration: "none", fontWeight: 700, fontSize: 14 }}>Volver al panel</a>
        </div>
      </div>
    );
  }

  return (
    <div style={{ minHeight: "100vh", background: T.bg, color: T.ivory, padding: "24px 20px 60px" }}>
      <div style={{ maxWidth: 560, margin: "0 auto" }}>

        <a href="index.html" style={{ color: T.ivoryMuted, fontSize: 12.5, textDecoration: "none" }}>← Volver al panel</a>
        <div style={{ fontSize: 18, fontWeight: 600, margin: "10px 0 20px" }}>Check-out / Cierre de cuenta</div>

        <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
          <button onClick={() => setModo("checkout")} style={tabEstilo(modo === "checkout")}>Cerrar cuenta</button>
          <button onClick={() => setModo("corregir")} style={tabEstilo(modo === "corregir")}>Corregir un pago anterior</button>
        </div>

        {modo === "corregir" ? (
          <CorregirPago
            corregirIdInicial={corregirIdParam}
            corregirNombreInicial={corregirNombreParam}
            corregirCodigoInicial={corregirCodigoParam}
          />
        ) : (
        <React.Fragment>

        {idBloqueado ? (
          <div style={{ marginBottom: 20 }}>
            {cargando ? (
              <div style={{ color: T.ivoryMuted, fontSize: 13 }}>Cargando huésped...</div>
            ) : noEncontrado ? (
              <div style={{ background: "rgba(184,63,50,0.12)", border: "1px solid #A83E32", color: "#D98A7D", borderRadius: 10, padding: "10px 14px", fontSize: 13 }}>
                No se encontró esta reserva entre los huéspedes en casa hoy.
              </div>
            ) : reservaSel && (
              <div style={{ background: "rgba(201,162,75,0.10)", border: `2px solid ${T.gold}`, borderRadius: 10, padding: "12px 14px" }}>
                <div style={{ fontSize: 11, color: T.ivoryMuted, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 3 }}>Cerrando cuenta de</div>
                <div style={{ fontSize: 15, fontWeight: 700 }}>{reservaSel.codigo} — {reservaSel.nombre_completo || "Por confirmar"}</div>
              </div>
            )}
          </div>
        ) : (
          <React.Fragment>
            <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 8 }}>1. Selecciona huésped</div>
            {cargando ? (
              <div style={{ color: T.ivoryMuted, fontSize: 13, marginBottom: 20 }}>Cargando huéspedes en casa...</div>
            ) : huespedes.length === 0 ? (
              <div style={{ color: T.ivoryMuted, fontSize: 13, marginBottom: 20 }}>No hay huéspedes en casa hoy.</div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 20 }}>
                {huespedes.map((h) => (
                  <button key={h.reserva_id} onClick={() => setReservaSel(h)} style={{
                    textAlign: "left", padding: "10px 14px", borderRadius: 10, cursor: "pointer",
                    border: reservaSel?.reserva_id === h.reserva_id ? `2px solid ${T.gold}` : `1px solid ${T.cardBorder}`,
                    background: reservaSel?.reserva_id === h.reserva_id ? "rgba(201,162,75,0.15)" : T.card,
                    color: T.ivory, fontSize: 13.5,
                  }}>
                    <strong>{h.codigo}</strong> — {h.nombre_completo || "Por confirmar"}
                  </button>
                ))}
              </div>
            )}
          </React.Fragment>
        )}

        {reservaSel && cargandoFolio && (
          <div style={{ color: T.ivoryMuted, fontSize: 13 }}>Cargando folio...</div>
        )}

        {reservaSel && errorFolio && (
          <div style={{ background: "rgba(184,63,50,0.12)", border: "1px solid #A83E32", color: "#D98A7D", borderRadius: 10, padding: "10px 14px", fontSize: 13 }}>
            {errorFolio}
          </div>
        )}

        {reservaSel && folio && !cargandoFolio && !preCuentaVista && (
          <PreCuenta folio={folio} reservaSel={reservaSel} onContinuar={() => setPreCuentaVista(true)} onFolioActualizado={cargarFolio} />
        )}

        {reservaSel && folio && !cargandoFolio && preCuentaVista && (
          <React.Fragment>
          {vistaPreviaComprobante ? (
            <VistaPreviaComprobante
              folio={folio}
              tipoComprobante={tipoComprobante}
              facturaRuc={facturaRuc}
              facturaRazonSocial={facturaRazonSocial}
              fechaEmision={fechaEmision.trim()}
              pagos={construirPagos()}
              descripcionItemPreview={descripcionItemPreview}
              enviando={enviando}
              errorEnvio={errorEnvio}
              onVolver={() => setVistaPreviaComprobante(false)}
              onConfirmar={confirmarCheckout}
            />
          ) : (
          <React.Fragment>

            <button onClick={() => setPreCuentaVista(false)} style={{ background: "none", border: "none", color: T.ivoryMuted, fontSize: 12, cursor: "pointer", marginBottom: 12, padding: 0 }}>
              ← Volver a la pre-cuenta
            </button>

            <div style={{ color: T.ivoryMuted, fontSize: 12, marginBottom: 18 }}>
              Tipo de cambio referencial de hoy: <strong style={{ color: T.ivory }}>S/ {fmt(tipoCambioRef)}</strong> por US$ 1
            </div>

            {/* HOSPEDAJE */}
            <div style={{ background: T.card, border: `1px solid ${T.cardBorder}`, borderRadius: 14, padding: 16, marginBottom: 14 }}>
              <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 8 }}>🏕️ Hospedaje</div>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: T.ivoryMuted, marginBottom: 10 }}>
                <span>US$ {fmt(hospedajeUsd)}</span>
                <span>≈ S/ {fmt(hospedajeSoles)}</span>
              </div>
              {aplicarAdelantoA === "hospedaje" && adelantoMonto > 0 && (
                <div style={{ fontSize: 11.5, color: T.green, marginBottom: 8 }}>
                  − Adelanto aplicado: US$ {fmt(adelantoUsd)} → saldo US$ {fmt(saldoHospedajeUsd)}
                </div>
              )}
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 10 }}>
                <div style={{ fontSize: 12, color: T.ivoryMuted }}>Cobrar en:</div>
                <BotonMoneda moneda={monedaHospedaje} onChange={setMonedaHospedaje} />
              </div>

              {usaTipoCambioHospedaje && hayHospedajeQueCobrar && (
                <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 10 }}>
                  <span style={{ fontSize: 11.5, color: T.amber, flex: 1 }}>Tipo de cambio (venta) — S/ por US$1:</span>
                  <input type="number" min="0" step="0.001" value={tipoCambioHospedaje}
                    onChange={(e) => setTipoCambioHospedaje(e.target.value)}
                    style={{
                      width: 90, background: T.bg, border: `1px solid ${tipoCambioHospedajeOk ? T.cardBorder : T.red}`,
                      borderRadius: 6, padding: "6px 8px", color: T.ivory, fontSize: 13,
                    }} />
                </div>
              )}

              <div style={{ fontSize: 20, fontWeight: 700, color: T.gold, textAlign: "right", margin: "8px 0" }}>
                {monedaHospedaje === "USD" ? "US$" : "S/."} {fmt(montoCobroHospedaje)}
              </div>
              {hayHospedajeQueCobrar && (
                <React.Fragment>
                  <SelectorMetodo valor={metodoHospedaje} onChange={setMetodoHospedaje} />
                  {metodoHospedaje === "mixto" && (
                    <DesgloseMixto partes={mixtoHospedaje} onChange={setMixtoHospedaje}
                      total={round2(montoCobroHospedaje)} simbolo={monedaHospedaje === "USD" ? "US$" : "S/."} />
                  )}
                </React.Fragment>
              )}
              {!hayHospedajeQueCobrar && <div style={{ fontSize: 12, color: T.green }}>Cubierto por adelanto</div>}
            </div>

            {/* CONSUMO */}
            <div style={{ background: T.card, border: `1px solid ${T.cardBorder}`, borderRadius: 14, padding: 16, marginBottom: 14 }}>
              <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 8 }}>🍽️ Consumo</div>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: T.ivoryMuted, marginBottom: 4 }}>
                <span>S/ {fmt(consumoSoles)}</span>
                <span>≈ US$ {fmt(consumoUsd)}</span>
              </div>
              {Object.keys(folio.desglosePorCategoria || {}).length > 0 && (
                <div style={{ fontSize: 11, color: T.ivoryMuted, marginBottom: 10 }}>
                  {Object.entries(folio.desglosePorCategoria).map(([cat, monto]) => (
                    <div key={cat}>· {cat}: S/ {fmt(monto)}</div>
                  ))}
                </div>
              )}
              {aplicarAdelantoA === "consumo" && adelantoMonto > 0 && (
                <div style={{ fontSize: 11.5, color: T.green, marginBottom: 8 }}>
                  − Adelanto aplicado: S/ {fmt(adelantoSoles)} → saldo S/ {fmt(saldoConsumoSoles)}
                </div>
              )}
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 10 }}>
                <div style={{ fontSize: 12, color: T.ivoryMuted }}>Cobrar en:</div>
                <BotonMoneda moneda={monedaConsumo} onChange={setMonedaConsumo} />
              </div>

              {usaTipoCambioConsumo && hayConsumoQueCobrar && (
                <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 10 }}>
                  <span style={{ fontSize: 11.5, color: T.amber, flex: 1 }}>Tipo de cambio (compra) — S/ por US$1:</span>
                  <input type="number" min="0" step="0.001" value={tipoCambioConsumo}
                    onChange={(e) => setTipoCambioConsumo(e.target.value)}
                    style={{
                      width: 90, background: T.bg, border: `1px solid ${tipoCambioConsumoOk ? T.cardBorder : T.red}`,
                      borderRadius: 6, padding: "6px 8px", color: T.ivory, fontSize: 13,
                    }} />
                </div>
              )}

              <div style={{ fontSize: 20, fontWeight: 700, color: T.gold, textAlign: "right", margin: "8px 0" }}>
                {monedaConsumo === "USD" ? "US$" : "S/."} {fmt(montoCobroConsumo)}
              </div>
              {hayConsumoQueCobrar && (
                <React.Fragment>
                  <SelectorMetodo valor={metodoConsumo} onChange={setMetodoConsumo} />
                  {metodoConsumo === "mixto" && (
                    <DesgloseMixto partes={mixtoConsumo} onChange={setMixtoConsumo}
                      total={round2(montoCobroConsumo)} simbolo={monedaConsumo === "USD" ? "US$" : "S/."} />
                  )}
                </React.Fragment>
              )}
              {!hayConsumoQueCobrar && <div style={{ fontSize: 12, color: T.green }}>Cubierto por adelanto</div>}
            </div>

            {/* ADELANTO — siempre en USD */}
            <div style={{ background: T.card, border: `1px solid ${T.cardBorder}`, borderRadius: 14, padding: 16, marginBottom: 20 }}>
              <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 10 }}>💰 Adelanto ya pagado (US$)</div>
              <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 10 }}>
                <span style={{ fontSize: 14, color: T.ivoryMuted }}>US$</span>
                <input type="number" min="0" step="0.01" value={adelantoMonto}
                  onChange={(e) => setAdelantoMonto(Number(e.target.value) || 0)}
                  style={{
                    flex: 1, background: T.bg, border: `1px solid ${T.cardBorder}`, borderRadius: 8,
                    padding: "9px 12px", color: T.ivory, fontSize: 14,
                  }} />
              </div>
              <div style={{ fontSize: 12, color: T.ivoryMuted, marginBottom: 8 }}>Aplicar este adelanto a:</div>
              <div style={{ display: "flex", gap: 6 }}>
                {[
                  { valor: "hospedaje", label: "Hospedaje" },
                  { valor: "consumo", label: "Consumo" },
                  { valor: "ninguno", label: "Ninguno" },
                ].map((op) => (
                  <button key={op.valor} onClick={() => setAplicarAdelantoA(op.valor)} style={{
                    flex: 1, padding: "8px 0", borderRadius: 8, cursor: "pointer", fontSize: 12, fontWeight: 600,
                    border: aplicarAdelantoA === op.valor ? `2px solid ${T.gold}` : `1px solid ${T.cardBorder}`,
                    background: aplicarAdelantoA === op.valor ? "rgba(201,162,75,0.15)" : T.bg,
                    color: aplicarAdelantoA === op.valor ? T.gold : T.ivoryMuted,
                  }}>{op.label}</button>
                ))}
              </div>
            </div>

            {!puedeEmitir && (hayHospedajeQueCobrar || hayConsumoQueCobrar) && (
              <div style={{ fontSize: 11.5, color: T.ivoryMuted, marginBottom: 14 }}>
                🧾 La boleta/factura de esta cuenta la emite después Dante, Yanet o Royer desde "Corregir un pago anterior" — tú solo cierras el cobro.
              </div>
            )}

            {/* COMPROBANTE ELECTRÓNICO — se emite AUTOMÁTICAMENTE contra SUNAT
                (vía HaylliERP) al confirmar la vista previa. No es opcional
                para quien tiene permiso de emitir (sesion.puede_emitir_comprobantes):
                se emite un comprobante por cada moneda distinta que se cobre.
                Quien no tiene ese permiso nunca ve esta sección — ver
                gruposComprobantePorMoneda más arriba. */}
            {hayComprobantePorEmitir && (
              <div style={{ background: T.card, border: `1px solid ${T.cardBorder}`, borderRadius: 14, padding: 16, marginBottom: 20 }}>
                <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 4 }}>🧾 Comprobante electrónico (SUNAT)</div>
                <div style={{ fontSize: 11.5, color: T.ivoryMuted, marginBottom: 12 }}>
                  Se emitirá automáticamente al confirmar, uno por cada moneda distinta que se esté cobrando ({Object.keys(gruposComprobantePorMoneda).map(m => gruposComprobantePorMoneda[m].join("+")).join(" · ")}).
                </div>
                <div style={{ display: "flex", gap: 6, marginBottom: tipoComprobante === "factura" ? 12 : 0 }}>
                  {[{ valor: "boleta", label: "Boleta" }, { valor: "factura", label: "Factura" }].map((op) => (
                    <button key={op.valor} onClick={() => setTipoComprobante(op.valor)} style={{
                      flex: 1, padding: "8px 0", borderRadius: 8, cursor: "pointer", fontSize: 12, fontWeight: 600,
                      border: tipoComprobante === op.valor ? `2px solid ${T.gold}` : `1px solid ${T.cardBorder}`,
                      background: tipoComprobante === op.valor ? "rgba(201,162,75,0.15)" : T.bg,
                      color: tipoComprobante === op.valor ? T.gold : T.ivoryMuted,
                    }}>{op.label}</button>
                  ))}
                </div>
                {tipoComprobante === "factura" && (
                  <React.Fragment>
                    <div style={{ marginBottom: 8 }}>
                      <div style={{ fontSize: 10.5, color: T.ivoryMuted, marginBottom: 4 }}>RUC del cliente (11 dígitos)</div>
                      <input value={facturaRuc} maxLength={11}
                        onChange={(e) => setFacturaRuc(e.target.value.replace(/\D/g, ""))}
                        placeholder="Ej: 20605979034"
                        style={{ width: "100%", background: T.bg, border: `1px solid ${T.cardBorder}`, borderRadius: 8, padding: "8px 10px", color: T.ivory, fontSize: 13 }} />
                    </div>
                    <div>
                      <div style={{ fontSize: 10.5, color: T.ivoryMuted, marginBottom: 4 }}>Razón social</div>
                      <input value={facturaRazonSocial}
                        onChange={(e) => setFacturaRazonSocial(e.target.value)}
                        placeholder="Ej: Empresa S.A.C."
                        style={{ width: "100%", background: T.bg, border: `1px solid ${T.cardBorder}`, borderRadius: 8, padding: "8px 10px", color: T.ivory, fontSize: 13 }} />
                    </div>
                  </React.Fragment>
                )}
                <div style={{ marginTop: 12 }}>
                  <div style={{ fontSize: 10.5, color: T.ivoryMuted, marginBottom: 4 }}>Fecha de emisión (opcional — solo para cerrar cuentas atrasadas de agosto con fecha 31/08/2026; déjalo vacío para emitir con la fecha de hoy)</div>
                  <input type="date" value={fechaEmision} onChange={(e) => setFechaEmision(e.target.value)}
                    style={{ width: "100%", background: T.bg, border: `1px solid ${T.cardBorder}`, borderRadius: 8, padding: "8px 10px", color: T.ivory, fontSize: 13 }} />
                </div>
              </div>
            )}

            {errorEnvio && (
              <div style={{ background: "rgba(184,63,50,0.12)", border: "1px solid #A83E32", color: "#D98A7D", borderRadius: 10, padding: "10px 14px", fontSize: 13, marginBottom: 14 }}>
                Error: {errorEnvio}
              </div>
            )}

            <button onClick={irAVistaPrevia} disabled={!puedeEnviar} style={{
              width: "100%", background: !puedeEnviar ? T.cardBorder : T.gold,
              color: !puedeEnviar ? T.ivoryMuted : "#1C1A20", border: "none", borderRadius: 10,
              padding: "15px 0", fontSize: 15, fontWeight: 700, cursor: !puedeEnviar ? "not-allowed" : "pointer",
            }}>
              {puedeEnviar ? (hayComprobantePorEmitir ? "Ver vista previa del comprobante →" : "✓ Cerrar cuenta") : "Revisa los montos antes de continuar"}
            </button>
          </React.Fragment>
          )}
          </React.Fragment>
        )}

        </React.Fragment>
        )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CheckoutPantalla />);
</script>
</body>
</html>
