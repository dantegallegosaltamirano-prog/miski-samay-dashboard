<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Miski Samay — Cargo rápido</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }

.layout-wrap { display: flex; gap: 24px; max-width: 900px; margin: 0 auto; justify-content: center; align-items: flex-start; }
.main-col { flex: 0 1 560px; min-width: 0; width: 100%; }
.cart-col { flex: 0 0 300px; position: sticky; top: 24px; max-height: calc(100vh - 48px); overflow-y: auto; }

.page-wrap { padding: 24px 20px 40px; }

@media (max-width: 860px) {
.layout-wrap { flex-direction: column; }
.cart-col {
position: fixed; left: 0; right: 0; bottom: 0; top: auto;
width: 100%; max-height: 68vh; border-radius: 18px 18px 0 0; z-index: 50;
}
.page-wrap.has-cart { padding-bottom: 64vh; }
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

const T = {
bg: "#0E0D0F", card: "#1C1A20", cardBorder: "#2A2730",
gold: "#C9A24B", ivory: "#EFEAE1", ivoryMuted: "#9B968E", green: "#6B8F71"
};

// Etiquetas e íconos "bonitos" para las categorías originales. Cualquier
// categoría nueva que se cree desde menu.html usa su propio nombre tal
// cual como etiqueta, y el ícono genérico 📦.
const ETIQUETA_CATEGORIA = {
gastronomia: "Restaurant", bebidas: "Bar", lavanderia: "Lavandería", otros: "Otros",
};
const ICONO_CATEGORIA = {
gastronomia: "🍽️", bebidas: "🍸", lavanderia: "🧺", otros: "📦",
};
function etiquetaCategoria(valor) {
return ETIQUETA_CATEGORIA[valor] || (valor.charAt(0).toUpperCase() + valor.slice(1));
}
function iconoCategoria(valor) {
return ICONO_CATEGORIA[valor] || "📦";
}

const idBloqueado = new URLSearchParams(window.location.search).get("id");
const tabInicial = new URLSearchParams(window.location.search).get("tab");

// ---------------------------------------------------------------
// Desayuno: no es un catálogo de productos fijos (como Restaurant/Bar),
// pero desde el 22 ago funciona con el mismo mecanismo de cantidad +/-
// que Restaurant/Bar, en vez de un formulario guiado paso a paso — así
// una sola pantalla cubre el pedido de varias personas del mismo domo
// (ej. 2x Huevos revueltos para la pareja + 1x Pancakes para el niño).
// Cada ítem es un "producto virtual" con precio S/ 0.00 (está incluido
// en la tarifa, no se cobra en el checkout), agrupado en 4 secciones
// fijas que definió Dante con su equipo.
// ---------------------------------------------------------------
const DESAYUNO_SECCIONES = [
{
titulo: "1. Plato principal",
items: [
{ id: "des-plato-tamal-huevos", nombre: "Tamal criollo + huevo a la inglesa" },
{ id: "des-plato-huevos-revueltos", nombre: "Huevos revueltos" },
{ id: "des-plato-huevos-fritos", nombre: "Huevos fritos" },
{ id: "des-plato-huevos-inglesa", nombre: "Huevos a la inglesa" },
{ id: "des-plato-huevos-omelette", nombre: "Huevos omelette" },
{ id: "des-plato-sandwich", nombre: "Sándwich" },
{ id: "des-plato-pancakes", nombre: "Pancakes" },
],
},
{
titulo: "2. Bebida fría — jugo natural",
items: [
{ id: "des-jugo-papaya", nombre: "Jugo de papaya" },
{ id: "des-jugo-piña", nombre: "Jugo de piña" },
{ id: "des-jugo-naranja", nombre: "Jugo de naranja" },
],
},
{
titulo: "3. Bebida caliente",
items: [
{ id: "des-cafe-espresso", nombre: "Café espresso" },
{ id: "des-cafe-capuchino", nombre: "Café capuchino" },
{ id: "des-cafe-americano", nombre: "Café americano" },
{ id: "des-leche", nombre: "Leche caliente" },
{ id: "des-mate-coca", nombre: "Mate de coca" },
{ id: "des-infusion-muna", nombre: "Infusión de muña" },
{ id: "des-infusion-toronjil", nombre: "Infusión de toronjil" },
{ id: "des-infusion-menta", nombre: "Infusión de menta" },
{ id: "des-te", nombre: "Té" },
{ id: "des-infusion-manzanilla", nombre: "Infusión de manzanilla" },
],
},
{
titulo: "4. Complementos",
items: [
{ id: "des-yogurt", nombre: "Yogurt" },
{ id: "des-granola", nombre: "Granola" },
{ id: "des-ensalada-fruta", nombre: "Ensalada de fruta" },
{ id: "des-mermelada", nombre: "Mermelada" },
{ id: "des-mantequilla", nombre: "Mantequilla" },
],
},
];
const DESAYUNO_NOTAS_ID = "des-notas";

function FilaDesayuno({ nombre, cant, onCambiar }) {
return (
<div style={{
display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10,
padding: "10px 12px", borderRadius: 10, marginBottom: 8,
border: `1px solid ${cant > 0 ? T.gold : T.cardBorder}`,
background: cant > 0 ? "rgba(201,162,75,0.08)" : T.card,
}}>
<div style={{ fontSize: 13, fontWeight: cant > 0 ? 700 : 500, color: cant > 0 ? T.gold : T.ivory }}>{nombre}</div>
<div style={{ display: "flex", alignItems: "center", gap: 10, flexShrink: 0 }}>
<button onClick={() => onCambiar(-1)} disabled={cant === 0} style={{
width: 26, height: 26, borderRadius: 8, border: `1px solid ${T.cardBorder}`,
background: T.bg, color: T.ivory, fontSize: 15, cursor: cant === 0 ? "default" : "pointer",
opacity: cant === 0 ? 0.4 : 1,
}}>–</button>
<div style={{ width: 18, textAlign: "center", fontSize: 14, fontWeight: 700 }}>{cant}</div>
<button onClick={() => onCambiar(1)} style={{
width: 26, height: 26, borderRadius: 8, border: `1px solid ${T.cardBorder}`,
background: T.bg, color: T.ivory, fontSize: 15, cursor: "pointer",
}}>+</button>
</div>
</div>
);
}

function PanelDesayuno({ carrito, cambiarCantidad, notasDesayuno, actualizarNotasDesayuno }) {
return (
<div>
{DESAYUNO_SECCIONES.map((seccion) => (
<div key={seccion.titulo} style={{ marginBottom: 18 }}>
<div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 8, color: T.ivoryMuted }}>{seccion.titulo}</div>
{seccion.items.map((item) => {
const productoVirtual = { id: item.id, nombre: item.nombre, precio: 0, categoria: "desayuno" };
const cant = carrito[item.id]?.cantidad || 0;
return (
<FilaDesayuno key={item.id} nombre={item.nombre} cant={cant} onCambiar={(delta) => cambiarCantidad(productoVirtual, delta)} />
);
})}
</div>
))}

<div style={{ marginBottom: 10 }}>
<div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 6 }}>Notas o combinaciones especiales (opcional)</div>
<textarea value={notasDesayuno} onChange={(e) => actualizarNotasDesayuno(e.target.value)} placeholder="Ej: sin sal, huevos bien cocidos, alergia a..." rows={2} style={{
width: "100%", background: T.bg, border: `1px solid ${T.cardBorder}`, borderRadius: 8, color: T.ivory, padding: "8px 10px", fontSize: 12.5, resize: "vertical", fontFamily: "inherit",
}} />
</div>
</div>
);
}

function ConsumoRapido() {
const [huespedes, setHuespedes] = useState([]);
const [cargando, setCargando] = useState(true);
const [reservaSel, setReservaSel] = useState(null);
const [noEncontrado, setNoEncontrado] = useState(false);

const [categoriaActiva, setCategoriaActiva] = useState(tabInicial === "desayuno" ? "desayuno" : null);
const [productos, setProductos] = useState([]);
const [cargandoProductos, setCargandoProductos] = useState(true);

const [carrito, setCarrito] = useState({});
const [notasDesayuno, setNotasDesayuno] = useState("");

const [enviando, setEnviando] = useState(false);
const [ultimoOk, setUltimoOk] = useState(null);

React.useEffect(() => {
fetch(`https://miski-samay-backend-production.up.railway.app/api/domos/estado-hoy`)
.then(r => r.json())
.then(data => {
const lista = Array.isArray(data) ? data : [];
setHuespedes(lista);
if (idBloqueado) {
const encontrado = lista.find(h => h.reserva_id === idBloqueado);
if (encontrado) setReservaSel(encontrado);
else setNoEncontrado(true);
}
setCargando(false);
})
.catch(() => setCargando(false));

// Traemos TODOS los productos activos de una sola vez. Las categorías
// (para las pestañas) se calculan de lo que realmente exista, así que
// una categoría nueva creada desde menu.html aparece sola, sin tocar
// este archivo.
fetch(`https://miski-samay-backend-production.up.railway.app/api/productos`)
.then(r => r.json())
.then(data => {
setProductos(Array.isArray(data) ? data : []);
setCargandoProductos(false);
})
.catch(() => setCargandoProductos(false));
}, []);

const categoriasDisponibles = [...new Set(productos.map(p => p.categoria))];

function cambiarCantidad(producto, delta) {
setCarrito(prev => {
const actual = prev[producto.id]?.cantidad || 0;
const nueva = Math.max(0, actual + delta);
const copia = { ...prev };
if (nueva === 0) {
delete copia[producto.id];
} else {
copia[producto.id] = { producto, cantidad: nueva };
}
return copia;
});
}

function actualizarNotasDesayuno(texto) {
setNotasDesayuno(texto);
setCarrito((prev) => {
const copia = { ...prev };
if (texto.trim()) {
copia[DESAYUNO_NOTAS_ID] = {
producto: { id: DESAYUNO_NOTAS_ID, nombre: `📝 Nota: ${texto.trim()}`, precio: 0, categoria: "desayuno" },
cantidad: 1,
};
} else {
delete copia[DESAYUNO_NOTAS_ID];
}
return copia;
});
}

function eliminarItem(productoId) {
setCarrito(prev => {
const copia = { ...prev };
delete copia[productoId];
return copia;
});
}

const lineasCarrito = Object.values(carrito);
const totalCarrito = lineasCarrito.reduce((acc, l) => acc + l.cantidad * Number(l.producto.precio), 0);
const cantidadItems = lineasCarrito.reduce((acc, l) => acc + l.cantidad, 0);

async function cargar() {
if (!reservaSel) { alert("Selecciona un huésped/domo."); return; }
if (lineasCarrito.length === 0) { alert("Selecciona al menos un producto."); return; }

setEnviando(true);
setUltimoOk(null);

try {
for (const linea of lineasCarrito) {
const resp = await fetch(`https://miski-samay-backend-production.up.railway.app/api/reservas/${reservaSel.reserva_id}/consumos`, {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({
categoria: linea.producto.categoria,
descripcion: `${linea.cantidad} x ${linea.producto.nombre}`,
monto: linea.cantidad * Number(linea.producto.precio),
}),
});
const data = await resp.json();
if (data.error) throw new Error(data.error);
}

setUltimoOk({
domo: reservaSel.codigo,
nombre: reservaSel.nombre_completo,
items: lineasCarrito,
total: totalCarrito,
});
setCarrito({});
} catch (err) {
alert("Error: " + err.message);
} finally {
setEnviando(false);
}
}

const productosActivos = categoriaActiva ? productos.filter(p => p.categoria === categoriaActiva) : [];
const hayCarrito = cantidadItems > 0;

return (
<div className={`page-wrap${hayCarrito ? " has-cart" : ""}`} style={{ minHeight: "100vh", background: T.bg, color: T.ivory }}>
<div className="layout-wrap">

<div className="main-col">

<a href="index.html" style={{ color: T.ivoryMuted, fontSize: 12.5, textDecoration: "none" }}>← Volver al panel</a>
<div style={{ fontSize: 18, fontWeight: 600, margin: "10px 0 20px" }}>Cargo rápido</div>

{ultimoOk && (
<div style={{ background: "rgba(107,143,113,0.15)", border: `1px solid ${T.green}`, borderRadius: 10, padding: "10px 14px", marginBottom: 16, fontSize: 13, color: T.green }}>
✓ Cargado: {ultimoOk.nombre} · Domo {ultimoOk.domo}
<div style={{ color: T.ivoryMuted, marginTop: 4 }}>
{ultimoOk.items.map((l, i) => (
<div key={i}>{l.cantidad} x {l.producto.nombre} — S/ {(l.cantidad * Number(l.producto.precio)).toFixed(2)}</div>
))}
</div>
<div style={{ marginTop: 4, fontWeight: 700 }}>Total: S/ {ultimoOk.total.toFixed(2)}</div>
</div>
)}

{idBloqueado ? (
<div style={{ marginBottom: 20 }}>
{cargando ? (
<div style={{ color: T.ivoryMuted, fontSize: 13 }}>Cargando huésped...</div>
) : noEncontrado ? (
<div style={{ background: "rgba(184,63,50,0.12)", border: "1px solid #A83E32", color: "#D98A7D", borderRadius: 10, padding: "10px 14px", fontSize: 13 }}>
No se encontró esta reserva entre los huéspedes en casa hoy. Verifica el link o usa el panel para elegir manualmente.
</div>
) : reservaSel && (
<div style={{ background: "rgba(201,162,75,0.10)", border: `2px solid ${T.gold}`, borderRadius: 10, padding: "12px 14px" }}>
<div style={{ fontSize: 11, color: T.ivoryMuted, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 3 }}>Pedido para</div>
<div style={{ fontSize: 15, fontWeight: 700 }}>{reservaSel.codigo} — {reservaSel.nombre_completo || "Por confirmar"}</div>
</div>
)}
</div>
) : (
<React.Fragment>
<div style={{ fontSize: 13, fontWeight: 600, marginBottom: 8 }}>1. Selecciona huésped</div>
{cargando ? (
<div style={{ color: T.ivoryMuted, fontSize: 13, marginBottom: 20 }}>Cargando huéspedes en casa...</div>
) : huespedes.length === 0 ? (
<div style={{ color: T.ivoryMuted, fontSize: 13, marginBottom: 20 }}>No hay huéspedes en casa hoy.</div>
) : (
<div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 20 }}>
{huespedes.map((h) => (
<button key={h.reserva_id} onClick={() => setReservaSel(h)} style={{
textAlign: "left", padding: "10px 14px", borderRadius: 10, cursor: "pointer",
border: reservaSel?.reserva_id === h.reserva_id ? `2px solid ${T.gold}` : `1px solid ${T.cardBorder}`,
background: reservaSel?.reserva_id === h.reserva_id ? "rgba(201,162,75,0.15)" : T.card,
color: T.ivory, fontSize: 13.5,
}}>
<strong>{h.codigo}</strong> — {h.nombre_completo || "Por confirmar"}
</button>
))}
</div>
)}
</React.Fragment>
)}

<div style={{ fontSize: 13, fontWeight: 600, marginBottom: 8 }}>2. Categoría</div>
<div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 20 }}>
<button onClick={() => setCategoriaActiva("desayuno")} style={{
padding: "14px 0", borderRadius: 10, cursor: "pointer", fontSize: 14, fontWeight: 600,
border: categoriaActiva === "desayuno" ? `2px solid ${T.gold}` : `1px solid ${T.cardBorder}`,
background: categoriaActiva === "desayuno" ? "rgba(201,162,75,0.15)" : T.card,
color: categoriaActiva === "desayuno" ? T.gold : T.ivory,
}}>
🍳 Desayuno
</button>
{cargandoProductos ? (
<div style={{ display: "flex", alignItems: "center", color: T.ivoryMuted, fontSize: 13 }}>Cargando más categorías...</div>
) : (
categoriasDisponibles.map((valor) => {
const activa = categoriaActiva === valor;
return (
<button key={valor} onClick={() => setCategoriaActiva(valor)} style={{
padding: "14px 0", borderRadius: 10, cursor: "pointer", fontSize: 14, fontWeight: 600,
border: activa ? `2px solid ${T.gold}` : `1px solid ${T.cardBorder}`,
background: activa ? "rgba(201,162,75,0.15)" : T.card,
color: activa ? T.gold : T.ivory,
}}>
{iconoCategoria(valor)} {etiquetaCategoria(valor)}
</button>
);
})
)}
</div>

{categoriaActiva === "desayuno" && (
<div>
<div style={{ fontSize: 13, fontWeight: 600, marginBottom: 8 }}>3. Desayuno</div>
<PanelDesayuno carrito={carrito} cambiarCantidad={cambiarCantidad} notasDesayuno={notasDesayuno} actualizarNotasDesayuno={actualizarNotasDesayuno} />
</div>
)}

{categoriaActiva && categoriaActiva !== "desayuno" && (
<div>
<div style={{ fontSize: 13, fontWeight: 600, marginBottom: 8 }}>3. Productos — {etiquetaCategoria(categoriaActiva)}</div>

{productosActivos.length === 0 ? (
<div style={{ color: T.ivoryMuted, fontSize: 13, marginBottom: 20 }}>No hay productos activos en esta categoría.</div>
) : (
<div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(140px, 1fr))", gap: 10, marginBottom: 20 }}>
{productosActivos.map((p) => {
const cant = carrito[p.id]?.cantidad || 0;
return (
<div key={p.id} style={{
display: "flex", flexDirection: "column", justifyContent: "space-between",
padding: "12px", borderRadius: 12, minHeight: 150,
border: cant > 0 ? `2px solid ${T.gold}` : `1px solid ${T.cardBorder}`,
background: cant > 0 ? "rgba(201,162,75,0.08)" : T.card,
}}>
<div>
<div style={{ fontSize: 20, marginBottom: 4 }}>{iconoCategoria(p.categoria)}</div>
<div style={{ fontSize: 13, fontWeight: 700, lineHeight: 1.25, marginBottom: 3 }}>{p.nombre}</div>
{p.descripcion && (
<div style={{ fontSize: 11, color: T.ivoryMuted, lineHeight: 1.3, marginBottom: 6 }}>{p.descripcion}</div>
)}
<div style={{ fontSize: 13, color: T.gold, fontWeight: 700 }}>S/ {Number(p.precio).toFixed(2)}</div>
</div>
<div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 12, marginTop: 10 }}>
<button onClick={() => cambiarCantidad(p, -1)} disabled={cant === 0} style={{
width: 28, height: 28, borderRadius: 8, border: `1px solid ${T.cardBorder}`,
background: T.bg, color: T.ivory, fontSize: 16, cursor: cant === 0 ? "default" : "pointer",
opacity: cant === 0 ? 0.4 : 1,
}}>–</button>
<div style={{ width: 18, textAlign: "center", fontSize: 14, fontWeight: 700 }}>{cant}</div>
<button onClick={() => cambiarCantidad(p, 1)} style={{
width: 28, height: 28, borderRadius: 8, border: `1px solid ${T.cardBorder}`,
background: T.bg, color: T.ivory, fontSize: 16, cursor: "pointer",
}}>+</button>
</div>
</div>
);
})}
</div>
)}
</div>
)}

</div>

{hayCarrito && (
<div className="cart-col" style={{ background: T.card, border: `1px solid ${T.cardBorder}`, borderRadius: 16, padding: "16px 16px 14px" }}>
<div style={{ fontSize: 13.5, fontWeight: 700, marginBottom: 10, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
<span>🛒 Tu pedido</span>
<span style={{ color: T.ivoryMuted, fontWeight: 500, fontSize: 11.5 }}>{cantidadItems} item{cantidadItems !== 1 ? "s" : ""}</span>
</div>

<div style={{ maxHeight: 280, overflowY: "auto", marginBottom: 10 }}>
{lineasCarrito.map((linea) => (
<div key={linea.producto.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, padding: "8px 0", borderBottom: `1px solid ${T.cardBorder}` }}>
<div style={{ flex: 1, minWidth: 0 }}>
<div style={{ fontSize: 12.5, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{linea.producto.nombre}</div>
<div style={{ fontSize: 11, color: T.ivoryMuted }}>{linea.cantidad} x S/ {Number(linea.producto.precio).toFixed(2)} = S/ {(linea.cantidad * Number(linea.producto.precio)).toFixed(2)}</div>
</div>
<div style={{ display: "flex", alignItems: "center", gap: 6, flexShrink: 0 }}>
<button onClick={() => cambiarCantidad(linea.producto, -1)} style={{
width: 22, height: 22, borderRadius: 6, border: `1px solid ${T.cardBorder}`,
background: T.bg, color: T.ivory, fontSize: 13, cursor: "pointer", lineHeight: 1,
}}>–</button>
<span style={{ fontSize: 12.5, fontWeight: 700, minWidth: 14, textAlign: "center" }}>{linea.cantidad}</span>
<button onClick={() => cambiarCantidad(linea.producto, 1)} style={{
width: 22, height: 22, borderRadius: 6, border: `1px solid ${T.cardBorder}`,
background: T.bg, color: T.ivory, fontSize: 13, cursor: "pointer", lineHeight: 1,
}}>+</button>
<button onClick={() => eliminarItem(linea.producto.id)} title="Quitar" style={{
width: 22, height: 22, borderRadius: 6, border: "none",
background: "transparent", color: "#D98A7D", fontSize: 14, cursor: "pointer", marginLeft: 2,
}}>✕</button>
</div>
</div>
))}
</div>

<div style={{ display: "flex", justifyContent: "space-between", fontSize: 14, fontWeight: 700, marginBottom: 12, paddingTop: 8, borderTop: `1px solid ${T.cardBorder}` }}>
<span>Total</span>
<span style={{ color: T.gold }}>S/ {totalCarrito.toFixed(2)}</span>
</div>

<button onClick={cargar} disabled={enviando} style={{
width: "100%", background: T.gold, color: "#1C1A20", border: "none", borderRadius: 8,
padding: "13px 0", fontSize: 14.5, fontWeight: 600, cursor: "pointer",
}}>
{enviando ? "Cargando..." : "✓ Confirmar pedido"}
</button>
</div>
)}

</div>
</div>
);
}

ReactDOM.createRoot(document.getElementById("root")).render(<ConsumoRapido />);
</script>
</body>
</html>
